# Local, backend-neutral telemetry for the gateway.
#
#   docker compose -f deploy/otel/docker-compose.yaml up -d
#   docker compose -f deploy/otel/docker-compose.yaml --env-file deploy/otel/jaeger.env up -d  # + Jaeger UI
#
# Then run the gateway with:
#   OTEL_TRACES_EXPORTER=otlp OTEL_METRICS_EXPORTER=otlp \
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 agentic-server ...
#
# See docs/deploying/observability.md.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/collector.yaml:ro
    environment:
      # `[debug]` by default; jaeger.env adds the Jaeger exporter.
      AGENTIC_OTEL_TRACE_EXPORTERS: ${AGENTIC_OTEL_TRACE_EXPORTERS:-[debug]}
    ports:
      - "127.0.0.1:4318:4318"   # OTLP/HTTP from the gateway
      - "127.0.0.1:8889:8889"   # Prometheus scrape endpoint
      - "127.0.0.1:13133:13133" # health check

  jaeger:
    profiles: [jaeger]
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    ports:
      - "127.0.0.1:16686:16686" # UI
