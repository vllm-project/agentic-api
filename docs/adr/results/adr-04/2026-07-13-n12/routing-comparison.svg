<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">KV-aware routing doubles cache reuse and cuts continuation latency</title>
  <desc id="chart-desc">Two bar charts compare load-only, approximate-prefix, and precise Responses-prefix routing over twelve sequential two-turn pairs per profile. Precise routing raises mean KV-cache hits from 49.54 percent to 99.08 percent and lowers mean continuation latency from 811.0 milliseconds to 316.5 milliseconds. Approximate and precise routing are effectively tied in this workload.</desc>
  <rect width="1000" height="650" fill="#ffffff"/>

  <text x="500" y="34" font-family="system-ui, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#0f172a">KV-aware routing doubles cache reuse and cuts continuation latency</text>
  <text x="500" y="58" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#475569">GPT-OSS-20B · two vLLM replicas · 12 sequential previous_response_id pairs per profile</text>

  <text x="270" y="103" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Mean continuation latency</text>
  <text x="270" y="122" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">milliseconds with 95% confidence interval · lower is better</text>

  <line x1="70" y1="470" x2="475" y2="470" stroke="#334155" stroke-width="1.2"/>
  <line x1="70" y1="395" x2="475" y2="395" stroke="#e2e8f0"/>
  <line x1="70" y1="320" x2="475" y2="320" stroke="#e2e8f0"/>
  <line x1="70" y1="245" x2="475" y2="245" stroke="#e2e8f0"/>
  <line x1="70" y1="170" x2="475" y2="170" stroke="#e2e8f0"/>
  <text x="60" y="474" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="#64748b">0</text>
  <text x="60" y="399" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="#64748b">300</text>
  <text x="60" y="324" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="#64748b">600</text>
  <text x="60" y="249" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="#64748b">900</text>
  <text x="60" y="174" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="#64748b">1,200</text>

  <rect x="112" y="267.3" width="76" height="202.7" rx="5" fill="#64748b"/>
  <line x1="150" y1="188.8" x2="150" y2="345.7" stroke="#0f172a" stroke-width="2"/>
  <line x1="142" y1="188.8" x2="158" y2="188.8" stroke="#0f172a" stroke-width="2"/>
  <line x1="142" y1="345.7" x2="158" y2="345.7" stroke="#0f172a" stroke-width="2"/>
  <text x="150" y="254" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">811.0 ms</text>

  <rect x="232" y="391.4" width="76" height="78.6" rx="5" fill="#2563eb"/>
  <line x1="270" y1="387.7" x2="270" y2="395.2" stroke="#0f172a" stroke-width="2"/>
  <line x1="262" y1="387.7" x2="278" y2="387.7" stroke="#0f172a" stroke-width="2"/>
  <line x1="262" y1="395.2" x2="278" y2="395.2" stroke="#0f172a" stroke-width="2"/>
  <text x="270" y="378" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">314.2 ms</text>

  <rect x="352" y="390.9" width="76" height="79.1" rx="5" fill="#059669"/>
  <line x1="390" y1="388.7" x2="390" y2="393.0" stroke="#0f172a" stroke-width="2"/>
  <line x1="382" y1="388.7" x2="398" y2="388.7" stroke="#0f172a" stroke-width="2"/>
  <line x1="382" y1="393.0" x2="398" y2="393.0" stroke="#0f172a" stroke-width="2"/>
  <text x="390" y="378" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">316.5 ms</text>

  <text x="150" y="493" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Load-only</text>
  <text x="270" y="493" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Approximate</text>
  <text x="390" y="493" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Precise</text>

  <line x1="510" y1="90" x2="510" y2="510" stroke="#e2e8f0"/>

  <text x="750" y="103" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0f172a">Mean KV-cache hit rate</text>
  <text x="750" y="122" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">cached input tokens · higher is better</text>

  <line x1="545" y1="470" x2="965" y2="470" stroke="#334155" stroke-width="1.2"/>
  <line x1="545" y1="395" x2="965" y2="395" stroke="#e2e8f0"/>
  <line x1="545" y1="320" x2="965" y2="320" stroke="#e2e8f0"/>
  <line x1="545" y1="245" x2="965" y2="245" stroke="#e2e8f0"/>
  <line x1="545" y1="170" x2="965" y2="170" stroke="#e2e8f0"/>
  <text x="535" y="474" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="#64748b">0%</text>
  <text x="535" y="399" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="#64748b">25%</text>
  <text x="535" y="324" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="#64748b">50%</text>
  <text x="535" y="249" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="#64748b">75%</text>
  <text x="535" y="174" font-family="system-ui, sans-serif" font-size="11" text-anchor="end" fill="#64748b">100%</text>

  <rect x="600" y="321.4" width="76" height="148.6" rx="5" fill="#64748b"/>
  <text x="638" y="307" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">49.54%</text>
  <text x="638" y="342" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">6 / 12 warm</text>

  <rect x="720" y="172.8" width="76" height="297.2" rx="5" fill="#2563eb"/>
  <text x="758" y="159" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">99.08%</text>
  <text x="758" y="194" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">12 / 12 warm</text>

  <rect x="840" y="172.8" width="76" height="297.2" rx="5" fill="#059669"/>
  <text x="878" y="159" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">99.08%</text>
  <text x="878" y="194" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#ffffff">12 / 12 warm</text>

  <text x="638" y="493" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Load-only</text>
  <text x="758" y="493" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Approximate</text>
  <text x="878" y="493" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#334155">Precise</text>

  <rect x="95" y="535" width="810" height="70" rx="8" fill="#f1f5f9"/>
  <text x="500" y="562" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Precise vs load-only: +49.54 cache-hit points · −494.5 ms · 60.97% faster</text>
  <text x="500" y="585" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#475569">Approximate and precise are effectively tied in this idle deterministic workload.</text>
  <text x="500" y="632" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">Source: load-only.csv, approximate.csv, precise.csv</text>
</svg>
