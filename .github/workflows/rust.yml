name: Rust

run-name: Rust build, test & lint

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  kubernetes:
    runs-on: ubuntu-latest
    env:
      KUBECTL_VERSION: v1.36.2
      KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
      KUBECONFORM_VERSION: v0.7.0
      KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pinned Kubernetes validators
        run: |
          curl --fail --location --silent --show-error \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            --output "${RUNNER_TEMP}/kubectl"
          echo "${KUBECTL_SHA256}  ${RUNNER_TEMP}/kubectl" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/kubectl"

          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/kubeconform.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${RUNNER_TEMP}/kubeconform.tar.gz" | sha256sum --check
          tar --extract --gzip --file "${RUNNER_TEMP}/kubeconform.tar.gz" --directory "${RUNNER_TEMP}" kubeconform

      - name: Render and validate Kubernetes manifests
        run: |
          set -o pipefail
          "${RUNNER_TEMP}/kubectl" kustomize deploy/kubernetes \
            | "${RUNNER_TEMP}/kubeconform" \
                -kubernetes-version 1.36.0 \
                -strict \
                -summary

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Test Codex and Claude launcher contracts
        run: bash scripts/tests/agentic-launchers-test.sh

      - name: Test agentic CLI end to end
        run: python3 scripts/tests/agentic-cli-e2e-test.py

      - name: Install Python for strict SDK contracts
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Verify Files, Vector Stores, and file-search SDK contracts
        run: |
          python3 -m venv "${RUNNER_TEMP}/file-search-sdk"
          "${RUNNER_TEMP}/file-search-sdk/bin/pip" install 'openai==3.13.0'
          cargo build -p agentic-server --all-features --locked
          "${RUNNER_TEMP}/file-search-sdk/bin/python" scripts/tests/file-search-sdk-test.py target/debug/agentic-server -v

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
        env:
          POSTGRES_DB: agentic_api_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentic_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/agentic_api_test?sslmode=disable
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0

      - name: Cache cargo registry and build
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-postgres-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-postgres-${{ runner.os }}-
            cargo-${{ runner.os }}-

      - name: Provision pgvector extension
        run: psql "$TEST_POSTGRES_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector"

      # Every ignored core test currently requires this isolated PostgreSQL service.
      # Keep new lifecycle/runtime targets in this gate; never add paid/network tests here.
      - name: Verify all PostgreSQL storage, retrieval, lifecycle, and worker contracts
        run: cargo test -p agentic-server-core --all-features --locked --lib --tests -- --ignored --test-threads=1

      - name: Verify bounded PDF ingestion
        run: cargo test -p agentic-server-core --features file-search-pdf --locked --test file_search_service pdf

  provider-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        provider: [dynamo, sglang]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.98.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false

      - name: Validate recorded cassettes
        if: matrix.provider == 'dynamo'
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 scripts/validate-cassettes.py

      - name: Replay provider upstream cassettes
        run: cargo test -p agentic-server-core --test ${{ matrix.provider }}_cassette_test
