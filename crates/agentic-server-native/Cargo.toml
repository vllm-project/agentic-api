[package]
name = "agentic-server-native"
description = "Agentic API gateway with a managed direct vLLM engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
agentic-core.workspace = true
agentic-server = { path = "../agentic-server" }
agentic-vllm = { path = "../agentic-vllm" }
futures.workspace = true
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
vllm-managed-engine.workspace = true

[dev-dependencies]
async-trait.workspace = true
axum.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
serde_yaml = "0.9"
tempfile = "3"
vllm-chat.workspace = true
vllm-llm = { workspace = true, features = ["test-util"] }
vllm-text.workspace = true

[lints]
workspace = true
