            high\")\n   ```\n\n   *or add a memory hint in the job definition for\
            \ subsequent runs.*\n\n4. **Optimize the Transform**  \n   - Use `repartition`\
            \ or `coalesce` to reduce partition count before heavy ops.  \n   - Offload\
            \ non‑critical columns to a temporary dataset (`select`).  \n   - If using\
            \ `groupBy`, check if a `join` can reduce the data size first.  \n   -\
            \ Cache / persist intermediate results only when necessary.\n\n5. **Run\
            \ a Dry‑Run**  \n   After changes, submit a small subset of data (e.g.,\
            \ 1 % or a specific date range) to confirm the memory usage stays within\
            \ limits.\n\n---\n\n### Recommended Immediate Action\n\nIf you need a\
