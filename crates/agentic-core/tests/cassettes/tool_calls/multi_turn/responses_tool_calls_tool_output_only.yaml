            \ |\n| **Inefficient transformations** | e.g., `groupBy`, `collect_list`,\
            \ missing `repartition` or `broadcast`. |\n| **Missing shuffle savings**\
            \ | Repartitioning to reduce shuffles can lower per‑task memory usage.\
            \ |\n| **Insufficient worker memory** | The job was allowed only 32 GB,\
            \ but the dataset size grew beyond that. |\n\n---\n\n## Next Steps\n\n\
