      tiktoken encoding does the gpt-4o model use?\"}","error":null,"name":"search_tiktoken_documentation","output":"###
      Search Results for: \"Which tiktoken encoding does the gpt-4o model use?\"\n\nNo
      relevant documentation found for your query. It''s either being indexed or the
      search query did not match any documentation.\n\nAs a fallback, this is the
      documentation for openai/tiktoken:\n\n# ⏳ tiktoken\n\ntiktoken is a fast [BPE](https://en.wikipedia.org/wiki/Byte_pair_encoding)
      tokeniser for use with\nOpenAI''s models.\n\n```python\nimport tiktoken\nenc
      = tiktoken.get_encoding(\"o200k_base\")\nassert enc.decode(enc.encode(\"hello
      world\")) == \"hello world\"\n\n# To get the tokeniser corresponding to a specific
      model in the OpenAI API:\nenc = tiktoken.encoding_for_model(\"gpt-4o\")\n```\n\nThe
      open source version of `tiktoken` can be installed from [PyPI](https://pypi.org/project/tiktoken):\n```\npip
      install tiktoken\n```\n\nThe tokeniser API is documented in `tiktoken/core.py`.\n\nExample
      code using `tiktoken` can be found in the\n[OpenAI Cookbook](https://github.com/openai/openai-cookbook/blob/main/examples/How_to_count_tokens_with_tiktoken.ipynb).\n\n\n##
      Performance\n\n`tiktoken` is between 3-6x faster than a comparable open source
      tokeniser:\n\n![image](https://raw.githubusercontent.com/openai/tiktoken/main/perf.svg)\n\nPerformance
      measured on 1GB of text using the GPT-2 tokeniser, using `GPT2TokenizerFast`
      from\n`tokenizers==0.13.2`, `transformers==4.24.0` and `tiktoken==0.2.0`.\n\n\n##
      Getting help\n\nPlease post questions in the [issue tracker](https://github.com/openai/tiktoken/issues).\n\nIf
      you work at OpenAI, make sure to check the internal documentation or feel free
      to contact\n@shantanu.\n\n## What is BPE anyway?\n\nLanguage models don''t see
      text like you and I, instead they see a sequence of numbers (known as tokens).\nByte
      pair encoding (BPE) is a way of converting text into tokens. It has a couple
      desirable\nproperties:\n1) It''s reversible and lossless, so you can convert
      tokens back into the original text\n2) It works on arbitrary text, even text
      that is not in the tokeniser''s training data\n3) It compresses the text: the
      token sequence is shorter than the bytes corresponding to the\n   original text.
      On average, in practice, each token corresponds to about 4 bytes.\n4) It attempts
      to let the model see common subwords. For instance, \"ing\" is a common subword
      in\n   English, so BPE encodings will often split \"encoding\" into tokens like
      \"encod\" and \"ing\"\n   (instead of e.g. \"enc\" and \"oding\"). Because the
      model will then see the \"ing\" token again and\n   again in different contexts,
      it helps models generalise and better understand grammar.\n\n`tiktoken` contains
      an educational submodule that is friendlier if you want to learn more about\nthe
