          trigger for Azure Functions (programming-language-powershell)","content":"#
          Timer trigger for Azure Functions (programming-language-powershell)\n##
          Configuration\nThe following table explains the binding configuration properties
          that you set in the *function.json* file.\n| function.json property | Description|
          \n|  --- | ---  |\n| **type** | Must be set to \u0022timerTrigger\u0022.
          This property is set automatically when you create the trigger in the Azure
          portal. |\n| **direction** | Must be set to \u0022in\u0022. This property
          is set automatically when you create the trigger in the Azure portal. |\n|
          **name** | The name of the variable that represents the timer object in
          function code. |\n| **schedule** | A NCRONTAB expression or a TimeSpan value.
          A \u0060TimeSpan\u0060 can be used only for a function app that runs on
          an App Service Plan. You can put the schedule expression in an app setting
          and set this property to the app setting name wrapped in **%** signs, as
          in this example: \u0022%ScheduleAppSetting%\u0022. For more information,
          see [Work with application settings](https://learn.microsoft.com/azure/azure-functions/functions-how-to-use-azure-function-app-settings#settings).
          |\n| **runOnStartup** | If \u0060true\u0060, the function is invoked when
          the runtime starts. For example, the runtime starts when the function app
          wakes up after going idle due to inactivity, when the function app restarts
          due to function changes, and when the function app scales out. *Use with
          caution.***runOnStartup** should rarely if ever be set to \u0060true\u0060,
          especially in production. |\n| **useMonitor** | Set to \u0060true\u0060
          or \u0060false\u0060 to indicate whether the schedule should be monitored.
          Schedule monitoring persists schedule occurrences to aid in ensuring the
          schedule is maintained correctly even when function app instances restart.
          If not set explicitly, the default is \u0060true\u0060 for schedules that
          have a recurrence interval greater than or equal to 1 minute. For schedules
          that trigger more than once per minute, the default is \u0060false\u0060.
          |\n\nWhen you\u0027re developing locally, add your application settings
          in the [local.settings.json file](https://learn.microsoft.com/azure/azure-functions/functions-develop-local#local-settings-file)
          in the \u0060Values\u0060 collection.\nCaution","contentUrl":"https://learn.microsoft.com/azure/azure-functions/functions-bindings-timer#configuration"},{"title":"Timer
