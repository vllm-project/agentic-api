        output: '{"results": [{"title": "Timer trigger for Azure Functions (programming-language-csharp)",
          "content": "# Timer trigger for Azure Functions (programming-language-csharp)\n##
          Usage\n| Functions version | Setting| \n|  --- | ---  |\n| 2.x (and higher)
          | `AzureFunctionsWebHost__hostid` environment variable |\n| 1.x | `id` in
          *host.json* |\n\nYou can omit the identifying value or manually set each
          function app''s identifying configuration to a different value.\nThe timer
          trigger uses a storage lock to ensure that there is only one timer instance
          when a function app scales out to multiple instances. If two function apps
          share the same identifying configuration and each uses a timer trigger,
          only one timer runs.\n### Retry behavior\nUnlike the queue trigger, the
          timer trigger doesn''t retry after a function fails. When a function fails,
          it isn''t called again until the next time on the schedule.\n### Manually
          invoke a timer trigger\nThe timer trigger for Azure Functions provides an
          HTTP webhook that can be invoked to manually trigger the function. This
          can be extremely useful in the following scenarios.\n1. Integration testing\n2.
          Slot swaps as part of a smoke test or warmup activity\n3. Initial deployment
          of a function to immediately populate a cache or lookup table in a database\nPlease
          refer to [manually run a non HTTP-triggered function](https://learn.microsoft.com/azure/azure-functions/functions-manually-run-non-http)
          for details on how to manually invoke a timer triggered function.\n### Troubleshooting\nFor
          information about what to do when the timer trigger doesn''t work as expected,
          see [Investigating and reporting issues with timer triggered functions not
          firing](https://github.com/Azure/azure-functions-host/wiki/Investigating-and-reporting-issues-with-timer-triggered-functions-not-firing).\n##
          Connections\nTimer triggers have an implicit dependency on blob storage,
          except when run locally through the Azure Functions Core Tools. The system
          uses blob storage to coordinate across multiple instances when the app scales
          out. It accesses blob storage using the host storage (`AzureWebJobsStorage`)
          connection. If you configure the host storage to use an [identity-based
          connection](https://learn.microsoft.com/azure/azure-functions/manage-connections?tabs=host,identity#define-connections),
          the identity should have the [Storage Blob Data Owner](https://learn.microsoft.com/azure/role-based-access-control/built-in-roles#storage-blob-data-owner)
          role, which is the default requirement for host storage.", "contentUrl":
          "https://learn.microsoft.com/azure/azure-functions/functions-bindings-timer#usage"},
