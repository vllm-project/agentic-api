          starts. For example, the runtime starts when the function app wakes up after
          going idle due to inactivity, when the function app restarts due to function
          changes, and when the function app scales out. *Use with caution.***runOnStartup**
          should rarely if ever be set to `true`, especially in production. |\n| **useMonitor**
          | Set to `true` or `false` to indicate whether the schedule should be monitored.
          Schedule monitoring persists schedule occurrences to aid in ensuring the
          schedule is maintained correctly even when function app instances restart.
          If not set explicitly, the default is `true` for schedules that have a recurrence
          interval greater than or equal to 1 minute. For schedules that trigger more
