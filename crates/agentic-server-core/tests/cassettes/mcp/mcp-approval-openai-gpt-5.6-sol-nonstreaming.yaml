          {"title": "Timer trigger for Azure Functions (programming-language-powershell)",
          "content": "# Timer trigger for Azure Functions (programming-language-powershell)\n##
          Configuration\nThe following table explains the binding configuration properties
          that you set in the *function.json* file.\n| function.json property | Description|
          \n|  --- | ---  |\n| **type** | Must be set to \"timerTrigger\". This property
          is set automatically when you create the trigger in the Azure portal. |\n|
          **direction** | Must be set to \"in\". This property is set automatically
          when you create the trigger in the Azure portal. |\n| **name** | The name
          of the variable that represents the timer object in function code. |\n|
          **schedule** | A NCRONTAB expression or a TimeSpan value. A `TimeSpan` can
          be used only for a function app that runs on an App Service Plan. You can
          put the schedule expression in an app setting and set this property to the
          app setting name wrapped in **%** signs, as in this example: \"%ScheduleAppSetting%\".
          For more information, see [Work with application settings](https://learn.microsoft.com/azure/azure-functions/functions-how-to-use-azure-function-app-settings#settings).
          |\n| **runOnStartup** | If `true`, the function is invoked when the runtime
          starts. For example, the runtime starts when the function app wakes up after
          going idle due to inactivity, when the function app restarts due to function
          changes, and when the function app scales out. *Use with caution.***runOnStartup**
          should rarely if ever be set to `true`, especially in production. |\n| **useMonitor**
          | Set to `true` or `false` to indicate whether the schedule should be monitored.
          Schedule monitoring persists schedule occurrences to aid in ensuring the
          schedule is maintained correctly even when function app instances restart.
          If not set explicitly, the default is `true` for schedules that have a recurrence
          interval greater than or equal to 1 minute. For schedules that trigger more
          than once per minute, the default is `false`. |\n\nWhen you''re developing
          locally, add your application settings in the [local.settings.json file](https://learn.microsoft.com/azure/azure-functions/functions-develop-local#local-settings-file)
          in the `Values` collection.\nCaution", "contentUrl": "https://learn.microsoft.com/azure/azure-functions/functions-bindings-timer#configuration"},
          {"title": "Timer trigger for Azure Functions (programming-language-javascript)",
          "content": "# Timer trigger for Azure Functions (programming-language-javascript)\n##
          Configuration\n### **Model v3**\nThe following table explains the binding
          configuration properties that you set in the *function.json* file.\n| Property
          | Description| \n|  --- | ---  |\n| **type** | Must be set to \"timerTrigger\".
          This property is set automatically when you create the trigger in the Azure
          portal. |\n| **direction** | Must be set to \"in\". This property is set
          automatically when you create the trigger in the Azure portal. |\n| **name**
          | The name of the variable that represents the timer object in function
          code. |\n| **schedule** | A NCRONTAB expression or a TimeSpan value. A `TimeSpan`
          can be used only for a function app that runs on an App Service Plan. You
