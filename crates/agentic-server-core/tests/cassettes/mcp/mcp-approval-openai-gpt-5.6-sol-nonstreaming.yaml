          timer trigger doesn''t retry after a function fails. When a function fails,
          it isn''t called again until the next time on the schedule.\n### Manually
          invoke a timer trigger\nThe timer trigger for Azure Functions provides an
          HTTP webhook that can be invoked to manually trigger the function. This
          can be extremely useful in the following scenarios.\n1. Integration testing\n2.
          Slot swaps as part of a smoke test or warmup activity\n3. Initial deployment
          of a function to immediately populate a cache or lookup table in a database\nPlease
          refer to [manually run a non HTTP-triggered function](https://learn.microsoft.com/azure/azure-functions/functions-manually-run-non-http)
