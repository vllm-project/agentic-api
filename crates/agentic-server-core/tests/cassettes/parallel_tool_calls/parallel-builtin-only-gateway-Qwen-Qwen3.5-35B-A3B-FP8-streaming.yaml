    body:
      input: 'Do two separate web_search calls in parallel, in this single turn --
        do not wait for one to finish before starting the other. The first web_search
        call must batch two exact queries together: "potato nutrition facts" and "tomato
        nutrition facts". The second web_search call must batch two different exact
        queries together: "cucumber nutrition facts" and "carrot nutrition facts".
        Issue both calls now, then summarize each of the four results in one sentence.'
