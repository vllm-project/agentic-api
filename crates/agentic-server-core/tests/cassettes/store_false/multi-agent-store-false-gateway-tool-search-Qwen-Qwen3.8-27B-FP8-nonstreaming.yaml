- filename: t1
  request:
    body:
      input:
      - content: 'Use three subagents: one to find Paris weather using a discovered
          function tool, one to get the Paris time zone using a discovered function
          tool, and one to call the custom tool agentic_raw_echo with CUSTOM_CASSETTE_OK
          and report its output on one line. As /root, first discover get_weather
          and travel.get_timezone yourself with client tool_search. Then spawn exactly
          three children with fork_turns none and bounded assignments: paris_weather
          must discover get_weather if needed, invoke it for Paris, and report its
          actual result; paris_timezone must discover travel.get_timezone if needed,
          invoke it for Paris, and report its actual result; cassette_echo must invoke
          agentic_raw_echo with CUSTOM_CASSETTE_OK and report its actual output. Do
          not copy these root orchestration instructions into child messages. Only
          /root may end a response with PENDING_CLIENT_RESULTS. After spawning, /root
          may wait once for at most 10000 ms, then should return PENDING_CLIENT_RESULTS
          if children are unfinished. This lets the client send their tool results
          on the next request. Never interrupt the children. Children must not finalize
          with PENDING_CLIENT_RESULTS; they must invoke their own tools and read the
          actual results before returning a final answer.'
        role: user
        type: message
      max_output_tokens: 16384
      model: Qwen/Qwen3.8-27B-FP8
      multi_agent:
        enabled: true
        max_concurrent_subagents: 3
