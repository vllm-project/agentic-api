          text: '


            Both problems are implemented, executed, and verified. Here is my final
            summary:


            ---


            ## Problem 1: LeetCode #20 — Valid Parentheses


            **Algorithm:** Stack-based matching.

            - Iterate through the string character by character.

            - When an opening bracket (`(`, `{`, `[`) is encountered, push it onto
            the stack.

            - When a closing bracket (`)`, `}`, `]`) is encountered, check if the
            stack is non-empty and the top element is the corresponding opening bracket.
            If not, return `False`. Otherwise, pop the stack.

            - After processing all characters, the string is valid if and only if
            the stack is empty.


            **Time Complexity:** O(n) — each character is processed once.

            **Space Complexity:** O(n) — in the worst case, all characters are opening
            brackets stored on the stack.


            **Source:** [NeetCode — Valid Parentheses](https://neetcode.io/solutions/valid-parentheses)


            **Example Inputs & Outputs:**


            | Input | Output |

            |-------|--------|

            | `"()"` | `True` |

            | `"()[]{}"` | `True` |

            | `"(]"` | `False` |

            | `""` (empty) | `True` |

            | `"((("` (unmatched open) | `False` |

            | `"{[]()}"` (nested) | `True` |


            ---


            ## Problem 2: LeetCode #121 — Best Time to Buy and Sell Stock


            **Algorithm:** Single-pass minimum-price tracking.

            - Track the minimum price seen so far (`min_price`).

            - At each day, compute the potential profit if selling at the current
            price (`price - min_price`).

            - Maintain the maximum profit seen across all days.

            - This works because for any sell day `j`, the optimal buy day is the
            day with the minimum price before `j`.


            **Time Complexity:** O(n) — single pass through the array.

            **Space Complexity:** O(1) — only two scalar variables are used.


            **Source:** [LeetCode Official — Best Time to Buy and Sell Stock](https://leetcode.com/problems/best-time-to-buy-and-sell-stock/)


            **Example Inputs & Outputs:**


            | Input | Output | Explanation |

            |-------|--------|-------------|

            | `[7, 1, 5, 3, 6, 4]` | `5` | Buy at 1, sell at 6 |

            | `[7, 6, 4, 3, 1]` | `0` | Prices only decrease |

            | `[5]` (single day) | `0` | Cannot buy and sell |

            | `[2, 9]` | `7` | Buy at 2, sell at 9 |

            | `[4, 1]` | `0` | Minimum comes after |

            | `[]` (empty) | `0` | No days available |'
