            I have everything I need. Here is my concise report for the parent.


            ---


            ## Python `csv` Module — Documentation Findings


            ### Canonical documentation URL(s)

            - **Primary (current):** https://docs.python.org/3/library/csv.html

            - **Version-pinned (still common on the web):** https://docs.python.org/3.12/library/csv.html
            (also 3.14, 3.10, 3.7, etc.)

            - **Python 2 (legacy):** https://docs.python.org/2/library/csv.html

            - Source code: `Lib/csv.py`


            ### Purpose

            The built-in `csv` module provides classes to read and write **CSV (Comma
            Separated Values)** — the most common import/export format for spreadsheets
            and databases. There is no formal "CSV standard"; the format is defined
            operationally by the many applications that use it (delimiters, quoting,
            and line endings vary). The module hides those details behind a single,
            efficient interface. Note: when the `csvfile` argument is a file object,
            it should be opened with `newline=''''`, since the module does its own
            (universal) newline handling.


            ### Key classes / functions

            - **`csv.reader(csvfile, dialect=..., **fmtparams)`** — reads CSV data
            and yields each row as a `list` of `str`.

            - **`csv.writer(csvfile, dialect=..., **fmtparams)`** — writes CSV data
            from iterables of fields.

            - **`csv.DictReader`** — like `reader`, but each row is a `dict` keyed
            by `fieldnames` (field names come from the header row or can be passed
            explicitly).

            - **`csv.DictWriter`** — like `writer`, but writes `dict` rows; `fieldnames`
            is a required parameter.

            - **`csv.excel`** — the default dialect (commas, double-quote, `\r\n`
            line terminator). Also `csv.excel_tabbed` (tab-delimited).

            - **Dialect helpers:** `csv.register_dialect(name, dialect)`, `csv.unregister_dialect(name)`,
            `csv.list_dialects()`, `csv.getreader(dialect)`, `csv.getwriter(dialect)`.

            - **Other:** `csv.field_size_limit(field_size)` (raises `csv.Error` if
            exceeded), `csv.Error` (the exception type).


            ### `QUOTE_*` constants (used by the `quoting` parameter)

            - **`csv.QUOTE_MINIMAL`** (default) — quote fields only when necessary
            (they contain the delimiter, the quotechar, or a `\r`/`\n`).

            - **`csv.QUOTE_ALL`** — quote all fields.

            - **`csv.QUOTE_NONE`** — never quote (may raise `Error` if unquoted special
            characters are encountered).

            - **`csv.QUOTE_NONNUMERIC`** — quote all non-numeric fields (unquoted
            fields are converted to `float` on read).


            ### The `dialect` parameter

            `csv.reader`, `csv.writer` (and the `Dict*` classes) accept an optional
            **`dialect`** argument — either a `csv.Dialect` subclass **instance**
            or one of the **strings** returned by `csv.list_dialects()` (e.g. `''excel''`,
            `''excel-tab''`). It selects a predefined set of formatting parameters.
            Individual parameters can be overridden with the remaining `**fmtparams`
            keyword arguments (e.g. `delimiter='',''`, `quoting=csv.QUOTE_ALL`). The
            `Dialect` base class is just a container for these attributes: `delimiter`,
            `quotechar`, `escapechar`, `lineterminator`, `skipinitialspace`, `doublequote`,
            `strict`, and `quoting`.


            ### Default delimiters / formatting (from the default `excel` dialect)

            - `delimiter` = **`'',''`** (comma)

            - `quotechar` = **`''"''`** (double quote)

            - `escapechar` = `None` (disabled)

            - `lineterminator` = **`''\r\n''`** (reader recognizes either `\r` or
            `\n`)

            - `skipinitialspace` = `False`

            - `doublequote` = `True`

            - `strict` = `False`

            - `quoting` = **`csv.QUOTE_MINIMAL`** (defaults to `QUOTE_NONE` if `quotechar`
            is set to `None`)


            Additional nuance: extra dictionary values in a `DictWriter` can be `''raise''`
            (default, raises `ValueError`) or `''ignore''`.'
