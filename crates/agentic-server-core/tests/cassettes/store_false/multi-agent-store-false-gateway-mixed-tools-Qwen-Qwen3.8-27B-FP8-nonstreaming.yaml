        content:
        - annotations: []
          text: "Based on the official Python documentation at https://docs.python.org/3/library/csv.html,\
            \ here's a comprehensive summary of the `csv` module:\n\n---\n\n## Python\
            \ `csv` Module Summary\n\nThe `csv` module is Python's built-in library\
            \ for reading and writing CSV (Comma Separated Values) files — the most\
            \ common import/export format for spreadsheets and databases. It provides\
            \ C-optimized implementations for parsing and writing CSV data.\n\n###\
            \ Core Classes\n\n#### `csv.reader(csvfile, dialect='excel', **kwargs)`\n\
            - Returns a reader object that processes lines from `csvfile`.\n- `csvfile`\
            \ must be an iterable of strings (most commonly a file-like object opened\
            \ with `newline=''`).\n- Supports an optional `dialect` parameter or individual\
            \ parameter overrides.\n- Yields rows as lists of strings.\n- Public attributes:\n\
            \  - `dialect` — read-only description of the dialect in use.\n  - `line_num`\
            \ — the number of lines read from the source (not the same as number of\
            \ records, since records can span multiple lines).\n\n#### `csv.writer(csvfile,\
            \ dialect='excel', **kwargs)`\n- Returns a writer object that writes rows\
            \ to `csvfile`.\n- `csvfile` must support a `.write()` method.\n- Methods:\n\
            \  - `writerow(row)` — writes a single row (sequence of values).\n  -\
            \ `writerows(rows)` — writes multiple rows.\n- Public attribute: `dialect`\
            \ — read-only description of the dialect in use.\n\n#### `csv.DictReader(f,\
            \ fieldnames=None, restkey=None, restval=None, dialect='excel', **kwargs)`\n\
            - Like `csv.reader` but returns each row as a dictionary.\n- `fieldnames`\
            \ — list of keys for the dict; if not provided, reads the first row to\
            \ determine them.\n- `restkey` — key for extra values that don't match\
            \ a field name.\n- `restval` — value used when a row has fewer values\
            \ than field names.\n- Public attributes:\n  - `fieldnames` — initialized\
            \ on first access or from the first row.\n  - `line_num` — number of lines\
            \ read.\n- Methods: `readerline()`, `__next__()` (returns a dict).\n\n\
            #### `csv.DictWriter(f, fieldnames, restkey=None, restval=None, extrasaction='raise',\
            \ dialect='excel', **kwargs)`\n- Like `csv.writer` but writes dict rows.\n\
            - `fieldnames` is **required** (unlike DictReader).\n- `extrasaction`\
            \ — `'raise'` (default) raises an error if a dict has keys not in `fieldnames`;\
            \ `'ignore'` silently ignores extra keys.\n- Methods:\n  - `writerow(rowdict)`\
            \ — writes a single dict row.\n  - `writerows(rowdicts)` — writes multiple\
            \ dict rows.\n  - `writeheader()` — writes the field name header row.\n\
            \n### Dialect Handling\n\n- **Dialects** define a set of parameters (delimiter,\
            \ quotechar, lineterminator, etc.) that control how CSV is parsed/written.\n\
            - Built-in dialects:\n  - `'excel'` — standard CSV dialect (comma-delimited,\
            \ double-quote quoting, `\\r\\n` line terminator).\n  - `'excel-tab'`\
            \ — tab-delimited variant of excel.\n- **`csv.register_dialect(name, *args,\
            \ **kwargs)`** — register a new or overwrite an existing dialect.\n- **`csv.unregister_dialect(name)`**\
            \ — remove a registered dialect.\n- **`csv.getreader(dialect)` / `csv.getwriter(dialect)`**\
            \ — return reader/writer for a named dialect.\n- **`csv.exact_dialects()`**\
            \ — return names of all registered dialects.\n- You can subclass `csv.Dialect`\
            \ to create custom dialects.\n\n### Key Parameters (applicable to reader/writer)\n\
            \n| Parameter | Description |\n|-----------|-------------|\n| `delimiter`\
            \ | Single-character field separator (default: `,`) |\n| `doublequote`\
            \ | Whether to write two quote characters to represent one inside a quoted\
            \ field (default: `True`) |\n| `escapechar` | Character used to escape\
            \ the `quotechar` when `doublequote` is `False` |\n| `lineterminator`\
            \ | String used to terminate lines (default: `'\\r\\n'`) |\n| `quotechar`\
            \ | Character to quote fields containing special characters (default:\
            \ `\"`) |\n| `quoting` | Controls when quotes are added: `QUOTE_ALL`,\
            \ `QUOTE_MINIMAL` (default), `QUOTE_NONNUMERIC`, `QUOTE_NONE` |\n| `skipinitialspace`\
            \ | Whether to ignore whitespace after `delimiter` (default: `False`)\
            \ |\n| `strict` | If `True`, raise `Error` on bad CSV input (default:\
            \ `False`) |\n\n### Utility Functions\n\n- **`csv.field_size_limit([new_limit])`**\
            \ — get or set the maximum allowed field size (default is very large).\n\
            - **`csv.Error`** — exception raised on malformed CSV input (when `strict=True`).\n\
            \n### Usage Notes\n\n- Always open files with `newline=''` to prevent\
            \ the platform's universal newline translation from interfering with the\
            \ csv module's own newline handling.\n- The module handles multi-line\
            \ fields (fields containing the line terminator), quoted fields, and embedded\
            \ delimiters automatically based on the configured dialect."
