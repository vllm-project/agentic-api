            have everything I need. Here is my concise report for the parent.\n\n---\n\n##
            Python `csv` Module — Documentation Findings\n\n### Canonical documentation
            URL(s)\n- **Primary (current):** https://docs.python.org/3/library/csv.html\n-
            **Version-pinned (still common on the web):** https://docs.python.org/3.12/library/csv.html
            (also 3.14, 3.10, 3.7, etc.)\n- **Python 2 (legacy):** https://docs.python.org/2/library/csv.html\n-
            Source code: `Lib/csv.py`\n\n### Purpose\nThe built-in `csv` module provides
            classes to read and write **CSV (Comma Separated Values)** — the most
            common import/export format for spreadsheets and databases. There is no
            formal \"CSV standard\"; the format is defined operationally by the many
            applications that use it (delimiters, quoting, and line endings vary).
            The module hides those details behind a single, efficient interface. Note:
            when the `csvfile` argument is a file object, it should be opened with
            `newline=''''`, since the module does its own (universal) newline handling.\n\n###
            Key classes / functions\n- **`csv.reader(csvfile, dialect=..., **fmtparams)`**
            — reads CSV data and yields each row as a `list` of `str`.\n- **`csv.writer(csvfile,
            dialect=..., **fmtparams)`** — writes CSV data from iterables of fields.\n-
            **`csv.DictReader`** — like `reader`, but each row is a `dict` keyed by
            `fieldnames` (field names come from the header row or can be passed explicitly).\n-
            **`csv.DictWriter`** — like `writer`, but writes `dict` rows; `fieldnames`
            is a required parameter.\n- **`csv.excel`** — the default dialect (commas,
            double-quote, `\\r\\n` line terminator). Also `csv.excel_tabbed` (tab-delimited).\n-
            **Dialect helpers:** `csv.register_dialect(name, dialect)`, `csv.unregister_dialect(name)`,
            `csv.list_dialects()`, `csv.getreader(dialect)`, `csv.getwriter(dialect)`.\n-
            **Other:** `csv.field_size_limit(field_size)` (raises `csv.Error` if exceeded),
            `csv.Error` (the exception type).\n\n### `QUOTE_*` constants (used by
            the `quoting` parameter)\n- **`csv.QUOTE_MINIMAL`** (default) — quote
            fields only when necessary (they contain the delimiter, the quotechar,
            or a `\\r`/`\\n`).\n- **`csv.QUOTE_ALL`** — quote all fields.\n- **`csv.QUOTE_NONE`**
            — never quote (may raise `Error` if unquoted special characters are encountered).\n-
            **`csv.QUOTE_NONNUMERIC`** — quote all non-numeric fields (unquoted fields
            are converted to `float` on read).\n\n### The `dialect` parameter\n`csv.reader`,
            `csv.writer` (and the `Dict*` classes) accept an optional **`dialect`**
            argument — either a `csv.Dialect` subclass **instance** or one of the
            **strings** returned by `csv.list_dialects()` (e.g. `''excel''`, `''excel-tab''`).
            It selects a predefined set of formatting parameters. Individual parameters
            can be overridden with the remaining `**fmtparams` keyword arguments (e.g.
            `delimiter='',''`, `quoting=csv.QUOTE_ALL`). The `Dialect` base class
            is just a container for these attributes: `delimiter`, `quotechar`, `escapechar`,
            `lineterminator`, `skipinitialspace`, `doublequote`, `strict`, and `quoting`.\n\n###
            Default delimiters / formatting (from the default `excel` dialect)\n-
            `delimiter` = **`'',''`** (comma)\n- `quotechar` = **`''\"''`** (double
