          Core Classes\n\n**`csv.reader(csvfile, dialect=''excel'', **kwargs)`**\n-
          Returns an iterator yielding rows as lists of strings.\n- `csvfile` must
          be an iterable of strings (file opened with `newline=''''`).\n- Attributes:
          `dialect` (read-only), `line_num` (lines read, not records).\n\n**`csv.writer(csvfile,
          dialect=''excel'', **kwargs)`**\n- Writes rows to `csvfile`.\n- Methods:
          `writerow(row)`, `writerows(rows)`.\n- Attribute: `dialect` (read-only).\n\n**`csv.DictReader(f,
          fieldnames=None, restkey=None, restval=None, dialect=''excel'', **kwargs)`**\n-
          Like reader but yields rows as dictionaries.\n- `fieldnames` — keys for
          the dict; auto-detected from first row if omitted.\n- `restkey` — key for
          extra values; `restval` — fill value for missing values.\n- Attributes:
          `fieldnames`, `line_num`.\n\n**`csv.DictWriter(f, fieldnames, restkey=None,
          restval=None, extrasaction=''raise'', dialect=''excel'', **kwargs)`**\n-
          Like writer but accepts dict rows.\n- `fieldnames` is **required**.\n- `extrasaction`
          — `''raise''` (default) or `''ignore''` for unknown keys.\n- Methods: `writerow(rowdict)`,
          `writerows(rowdicts)`, `writeheader()`.\n\n### Dialect Handling\n- Dialects
          define parsing/writing parameters (delimiter, quotechar, lineterminator,
          etc.).\n- Built-in: `''excel''` (comma, double-quote, `\\r\\n`) and `''excel-tab''`
          (tab-delimited).\n- `csv.register_dialect(name, ...)`, `csv.unregister_dialect(name)`,
          `csv.exact_dialects()`\n- Can subclass `csv.Dialect` for custom dialects.\n\n###
          Key Parameters\n| Param | Purpose |\n|-------|---------|\n| `delimiter`
          | Field separator (default `,`) |\n| `quotechar` | Quote character (default
          `\"`) |\n| `quoting` | `QUOTE_MINIMAL` (default), `QUOTE_ALL`, `QUOTE_NONNUMERIC`,
          `QUOTE_NONE` |\n| `doublequote` | Double quotes to escape (default `True`)
          |\n| `escapechar` | Escape char when `doublequote=False` |\n| `lineterminator`
          | Line ending (default `''\\r\\n''`) |\n| `skipinitialspace` | Ignore space
          after delimiter |\n| `strict` | Raise `Error` on malformed input |\n\n###
          Utilities\n- `csv.field_size_limit([new_limit])` — get/set max field size.\n-
          `csv.Error` — exception for malformed input (with `strict=True`).\n\n###
          Important Notes\n- Open files with `newline=''''` to avoid interference
          with the module''s newline handling.\n- Handles multi-line fields, quoted
          fields, and embedded delimiters automatically."}'
