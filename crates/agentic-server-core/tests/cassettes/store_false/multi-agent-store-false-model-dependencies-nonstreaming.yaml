          or finish the missing work yourself. Preserve successful work. If a limit
          prevents completion, state what remains incomplete instead of claiming success.
          Each agent has its own context and the same tools. Tools discovered before
          spawning are available to the child. Once a task is assigned to a child,
          use its returned result rather than repeating its tool calls yourself. Client
          tool outputs are routed to the calling agent, which resumes and reports
