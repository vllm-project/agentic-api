            \ the exact method signatures against the `tiktoken/core.py` source on\
            \ GitHub so the function names/parameters are accurate rather than guessed.\n\
            \n### 1. What tiktoken is\n- A fast **BPE (Byte Pair Encoding)** tokeniser\
            \ for OpenAI models.\n- BPE is **reversible and lossless** — you can always\
            \ convert tokens back to the original text; on average ~1 token ≈ 4 bytes.\n\
            - Performance: ~3–6x faster than a comparable open-source tokenizer.\n\
            \n### 2. Getting an `Encoding` object (module-level entry points)\n```python\n\
            import tiktoken\n\n# By named encoding\nenc = tiktoken.get_encoding(\"\
            o200k_base\")\n\n# Or resolve the tokenizer for a specific OpenAI API\
            \ model\nenc = tiktoken.encoding_for_model(\"gpt-4o\")\n```\nThe README's\
            \ canonical round-trip check:\n```python\nassert enc.decode(enc.encode(\"\
            hello world\")) == \"hello world\"\n```\n\n### 3. Encoding text → token\
            \ IDs (methods on `Encoding`)\n- **`encode(text: str, *, allowed_special=...,\
            \ disallowed_special=...) -> list[int]`**\n  The primary method. Converts\
            \ a string into a list of integer token IDs.\n  - `allowed_special`: special\
            \ tokens that *may* appear and be encoded as their special token.\n  -\
            \ `disallowed_special`: special tokens that must **not** appear (default\
            \ behavior errors if a disallowed special token's text is found).\n  -\
            \ If text contains a disallowed special token you get a `ValueError`.\
            \ To let it pass as normal text, pass `disallowed_special=()` (disable\
            \ all) or the specific token(s).\n- **`encode_ordinary(text: str) -> list[int]`**\n\
            \  Encodes while ignoring special tokens — equivalent to `encode(text,\
            \ disallowed_special=())`, but slightly faster.\n- **`encode_ordinary_batch(text:\
            \ list[str], *, num_threads=8) -> list[list[int]]`**\n  Parallel/batch\
            \ version of `encode_ordinary`.\n- **`count_tokens(text: str) -> int`**\n\
            \  Convenience wrapper that returns the number of tokens without building\
            \ the full list.\n\n### 4. Decoding token IDs → text (methods on `Encoding`)\n\
            - **`decode(tokens: Sequence[int]) -> str`**\n  Converts a sequence of\
            \ token IDs back into a string. This is what makes the `enc.decode(enc.encode(text))\
            \ == text` round-trip work.\n- **`decode_bytes(tokens: Sequence[int])\
            \ -> bytes`**\n  Decodes to raw bytes rather than a UTF-8 string.\n- **`decode_batch(tokens:\
            \ list[list[int]], *, num_threads=...) -> list[str]`**\n  Parallel/batch\
            \ decode of many token lists.\n\n### 5. Other useful attributes / helpers\n\
            - `enc.n_vocab` — vocabulary size.\n- `enc.max_token_value` — largest\
            \ token ID.\n- `enc.eot_token` — the end-of-text (`"
