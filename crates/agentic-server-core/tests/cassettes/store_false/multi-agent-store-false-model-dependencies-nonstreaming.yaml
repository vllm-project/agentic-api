      - content: 'Message Type: MESSAGE

          Task name: /root

          Sender: /root/csv_docs

          Payload:

          ## Python `csv` Module Summary (from official docs: https://docs.python.org/3/library/csv.html)


          ### Core Classes


          **`csv.reader(csvfile, dialect=''excel'', **kwargs)`**

          - Returns an iterator yielding rows as lists of strings.

          - `csvfile` must be an iterable of strings (file opened with `newline=''''`).

          - Attributes: `dialect` (read-only), `line_num` (lines read, not records).


          **`csv.writer(csvfile, dialect=''excel'', **kwargs)`**

          - Writes rows to `csvfile`.

          - Methods: `writerow(row)`, `writerows(rows)`.

          - Attribute: `dialect` (read-only).


          **`csv.DictReader(f, fieldnames=None, restkey=None, restval=None, dialect=''excel'',
          **kwargs)`**

          - Like reader but yields rows as dictionaries.

          - `fieldnames` — keys for the dict; auto-detected from first row if omitted.

          - `restkey` — key for extra values; `restval` — fill value for missing values.

          - Attributes: `fieldnames`, `line_num`.


          **`csv.DictWriter(f, fieldnames, restkey=None, restval=None, extrasaction=''raise'',
          dialect=''excel'', **kwargs)`**

          - Like writer but accepts dict rows.

          - `fieldnames` is **required**.

          - `extrasaction` — `''raise''` (default) or `''ignore''` for unknown keys.

          - Methods: `writerow(rowdict)`, `writerows(rowdicts)`, `writeheader()`.


          ### Dialect Handling

          - Dialects define parsing/writing parameters (delimiter, quotechar, lineterminator,
          etc.).

          - Built-in: `''excel''` (comma, double-quote, `\r\n`) and `''excel-tab''`
          (tab-delimited).

          - `csv.register_dialect(name, ...)`, `csv.unregister_dialect(name)`, `csv.exact_dialects()`

          - Can subclass `csv.Dialect` for custom dialects.


          ### Key Parameters

          | Param | Purpose |

          |-------|---------|

          | `delimiter` | Field separator (default `,`) |

          | `quotechar` | Quote character (default `"`) |

          | `quoting` | `QUOTE_MINIMAL` (default), `QUOTE_ALL`, `QUOTE_NONNUMERIC`,
          `QUOTE_NONE` |

          | `doublequote` | Double quotes to escape (default `True`) |

          | `escapechar` | Escape char when `doublequote=False` |

          | `lineterminator` | Line ending (default `''\r\n''`) |

          | `skipinitialspace` | Ignore space after delimiter |

          | `strict` | Raise `Error` on malformed input |


          ### Utilities

          - `csv.field_size_limit([new_limit])` — get/set max field size.

          - `csv.Error` — exception for malformed input (with `strict=True`).


          ### Important Notes

          - Open files with `newline=''''` to avoid interference with the module''s
          newline handling.

          - Handles multi-line fields, quoted fields, and embedded delimiters automatically.'
        role: user
        type: message
