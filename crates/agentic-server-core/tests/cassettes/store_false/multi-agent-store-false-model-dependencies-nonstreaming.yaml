          than repeating the overall request to organize a team. When the user requires
          distinct results, choose disjoint items or scopes before spawning and put
          each child''s explicit selection and exclusions in its task message. Children
          choose independently; asking each to select popular examples does not ensure
          distinct results across the team. Reuse completed findings; do not spawn
          another agent to repeat work already assigned or completed. Before finalizing,
