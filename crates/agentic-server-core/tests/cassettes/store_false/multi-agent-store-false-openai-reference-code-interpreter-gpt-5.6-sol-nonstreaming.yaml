          \    left = 0\n    best = 0\n    for right, ch in enumerate(s):\n      \
          \  if ch in last_seen and last_seen[ch] >= left:\n            left = last_seen[ch]\
          \ + 1\n        last_seen[ch] = right\n        best = max(best, right - left\
          \ + 1)\n    return best\n\nls_inputs = [\"abcabcbb\", \"bbbbb\", \"pwwkew\"\
          ]\nls_outputs = [length_of_longest_substring(s) for s in ls_inputs]\nfor\
          \ s, out in zip(ls_inputs, ls_outputs):\n    print(f\"{s!r} -> {out}\")\n"
