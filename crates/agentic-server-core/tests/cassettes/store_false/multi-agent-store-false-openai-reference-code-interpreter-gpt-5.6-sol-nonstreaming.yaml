          logprobs: []
          text: "## Agent 2 — String and Stack Problems\n\nThese are established popular\
            \ interview-practice problems: both appear in LeetCode’s “most liked”\
            \ list and other curated interview lists. ([leetcode.com](https://leetcode.com/discuss/post/4632243/Leetcode-most-liked-questions-1-100/?utm_source=openai))\n\
            \n### 1. Valid Parentheses — LeetCode #20\n\nThe task is to determine\
            \ whether each closing bracket has a matching opening bracket of the same\
            \ type and whether brackets close in the correct order. ([leetcode.com](https://leetcode.com/problems/valid-parentheses/?trk=article-ssr-frontend-pulse_little-text-block&utm_source=openai))\n\
            \n**Algorithm:** Maintain a stack of opening brackets. For a closing bracket,\
            \ verify that the stack’s top is its matching opener; otherwise return\
            \ `False`. The input is valid only if the stack is empty at the end.\n\
            \n```python\ndef is_valid_parentheses(s: str) -> bool:\n    pairs = {\"\
            )\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n\n    for ch\
            \ in s:\n        if ch in pairs:\n            if not stack or stack.pop()\
            \ != pairs[ch]:\n                return False\n        else:\n       \
            \     stack.append(ch)\n\n    return not stack\n```\n\n**Example inputs\
            \ executed**\n\n```python\nvp_inputs = [\"()[]{}\", \"([)]\", \"([])\"\
            ]\n\nfor s in vp_inputs:\n    print(f\"{s!r} -> {is_valid_parentheses(s)}\"\
            )\n```\n\n**Actual interpreter output**\n\n```text\n'()[]{}' -> True\n\
            '([)]' -> False\n'([])' -> True\n```\n\n**Complexity:** `O(n)` time and\
            \ `O(n)` worst-case auxiliary space.\n\n---\n\n### 2. Longest Substring\
            \ Without Repeating Characters — LeetCode #3\n\nThe task is to return\
            \ the length of the longest contiguous substring containing no duplicate\
            \ characters. ([leetcode.com](https://leetcode.com/problems/longest-substring-without-repeating-characters/description/?source=post_page-----8e8aa82b5971--------------------------------&utm_source=openai))\n\
            \n**Algorithm:** Use a sliding window and a dictionary containing each\
            \ character’s most recent index. When a duplicate occurs inside the current\
            \ window, move the left boundary just beyond its previous occurrence.\n\
            \n```python\ndef length_of_longest_substring(s: str) -> int:\n    last_seen\
            \ = {}\n    left = 0\n    best = 0\n\n    for right, ch in enumerate(s):\n\
            \        if ch in last_seen and last_seen[ch] >= left:\n            left\
            \ = last_seen[ch] + 1\n\n        last_seen[ch] = right\n        best =\
            \ max(best, right - left + 1)\n\n    return best\n```\n\n**Example inputs\
            \ executed**\n\n```python\nls_inputs = [\"abcabcbb\", \"bbbbb\", \"pwwkew\"\
            ]\n\nfor s in ls_inputs:\n    print(f\"{s!r} -> {length_of_longest_substring(s)}\"\
            )\n```\n\n**Actual interpreter output**\n\n```text\n'abcabcbb' -> 3\n\
            'bbbbb' -> 1\n'pwwkew' -> 3\n```\n\n**Complexity:** `O(n)` time and `O(k)`\
            \ auxiliary space, where `k` is the number of distinct characters stored."
