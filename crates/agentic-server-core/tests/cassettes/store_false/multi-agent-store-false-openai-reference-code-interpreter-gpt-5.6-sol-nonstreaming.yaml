        code: "from typing import List\n\ndef two_sum(nums: List[int], target: int)\
          \ -> List[int]:\n    seen = {}\n    for i, value in enumerate(nums):\n \
          \       complement = target - value\n        if complement in seen:\n  \
          \          return [seen[complement], i]\n        seen[value] = i\n    return\
          \ []\n\ndef max_profit(prices: List[int]) -> int:\n    min_price = float(\"\
          inf\")\n    best_profit = 0\n    for price in prices:\n        min_price\
          \ = min(min_price, price)\n        best_profit = max(best_profit, price\
          \ - min_price)\n    return best_profit\n\ntwo_sum_input = {\"nums\": [2,\
          \ 7, 11, 15], \"target\": 9}\nstock_input = {\"prices\": [7, 1, 5, 3, 6,\
          \ 4]}\n\nprint(\"two_sum:\", two_sum(**two_sum_input))\nprint(\"max_profit:\"\
          , max_profit(**stock_input))\n"
