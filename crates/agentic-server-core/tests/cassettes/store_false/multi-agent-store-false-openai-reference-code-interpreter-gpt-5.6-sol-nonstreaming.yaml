          text: "## Agent 1: Two Popular Array Problems\n\nThese two appear near the\
            \ top of a LeetCode community ranking by likes, supporting their selection\
            \ as popular problems. ([leetcode.com](https://leetcode.com/discuss/post/4632243/Leetcode-most-liked-questions-1-100/?utm_source=openai))\n\
            \n### 1. Two Sum\n\n**Source:** LeetCode Problem 1, **Two Sum**. The task\
            \ is to return the indices of two distinct elements whose sum equals the\
            \ target. ([leetcode.com](https://leetcode.com/problems/two-sum/?envId=xoqag3yj&envType=problem-list-v2&utm_source=openai))\n\
            \n**Algorithm:** Scan once while maintaining a hash map from previously\
            \ seen values to their indices. For each value, check whether its complement\
            \ (`target - value`) has already been seen.\n\n```python\nfrom typing\
            \ import List\n\ndef two_sum(nums: List[int], target: int) -> List[int]:\n\
            \    seen = {}\n    for i, value in enumerate(nums):\n        complement\
            \ = target - value\n        if complement in seen:\n            return\
            \ [seen[complement], i]\n        seen[value] = i\n    return []\n```\n\
            \n**Executed example input:**\n\n```python\nnums = [2, 7, 11, 15]\ntarget\
            \ = 9\n```\n\n**Actual code-interpreter output:**\n\n```text\ntwo_sum:\
            \ [0, 1]\n```\n\n**Complexity:** `O(n)` time and `O(n)` auxiliary space.\n\
            \n---\n\n### 2. Best Time to Buy and Sell Stock\n\n**Source:** LeetCode\
            \ Problem 121, **Best Time to Buy and Sell Stock**. It asks for the maximum\
            \ profit obtainable by buying once and selling on a later day, or `0`\
            \ if no profit is possible. ([leetcode.com](https://leetcode.com/problems/best-time-to-buy-and-sell-stock/))\n\
            \n**Algorithm:** Traverse the prices once, tracking the lowest price observed\
            \ so far. At each price, update the best profit using `current price -\
            \ minimum price`.\n\n```python\nfrom typing import List\n\ndef max_profit(prices:\
            \ List[int]) -> int:\n    min_price = float(\"inf\")\n    best_profit\
            \ = 0\n    for price in prices:\n        min_price = min(min_price, price)\n\
            \        best_profit = max(best_profit, price - min_price)\n    return\
            \ best_profit\n```\n\n**Executed example input:**\n\n```python\nprices\
            \ = [7, 1, 5, 3, 6, 4]\n```\n\n**Actual code-interpreter output:**\n\n\
            ```text\nmax_profit: 5\n```\n\n**Complexity:** `O(n)` time and `O(1)`\
            \ auxiliary space."
