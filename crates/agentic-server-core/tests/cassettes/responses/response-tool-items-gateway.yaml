          text: "\n\n## Correctness Review: `cache.py`\n\n### 1. TOCTOU / Check-Then-Act\
            \ Race (Lines 4–5)\n\n**Problem:** The membership test on line 4 and the\
            \ assignment on line 5 are not atomic. Under concurrent requests for the\
            \ same `user_id`, two threads can both observe `user_id not in CACHE`\
            \ as `True`, both deserialize, and both write. The final cached value\
            \ is non-deterministic if the two payloads differ.\n\n**Fix:** Use a lock,\
            \ or a thread-safe cache primitive (e.g., `threading.Lock` around the\
            \ check-and-set, or a `collections.defaultdict` + `Lock`). At minimum:\n\
            \n```python\nimport threading\n_CACHE_LOCK = threading.Lock()\n\ndef load_profile(user_id,\
            \ payload):\n    with _CACHE_LOCK:\n        if user_id not in CACHE:\n\
            \            CACHE[user_id] = pickle.loads(payload)\n    return CACHE[user_id]\n\
            ```\n\n---\n\n### 2. Stale / Never-Invalidated Cache (Lines 4–5)\n\n**Problem:**\
            \ The cache is \"first write wins, forever.\" Once a `user_id` is present,\
            \ any subsequent call with an updated `payload` is silently ignored and\
            \ the original (stale) value is returned. There is no TTL, no version\
            \ check, and no invalidation path. If the intent is to reflect the user's\
            \ current profile, this is incorrect.\n\n**Fix:** Either (a) add a TTL\
            \ / max-age and evict expired entries before the lookup, or (b) accept\
            \ an explicit `version` or `updated_at` field and re-cache when it changes,\
            \ or (c) rename the function and document that it intentionally returns\
            \ the *first* payload seen per key.\n\n---\n\n### 3. No Validation of\
            \ Deserialized Type (Line 5)\n\n**Problem:** `pickle.loads(payload)` can\
            \ return *any* Python object (int, str, list, `None`, …). The cache will\
            \ store whatever type is produced. Downstream code that assumes a dict\
            \ (e.g., `profile[\"name\"]`) will raise `TypeError`. The function gives\
            \ no signal that the cached value is not the expected shape.\n\n**Fix:**\
            \ Validate after deserialization:\n\n```python\nobj = pickle.loads(payload)\n\
            if not isinstance(obj, dict):\n    raise ValueError(f\"Expected dict payload,\
            \ got {type(obj).__name__}\")\nCACHE[user_id] = obj\n```\n\n---\n\n###\
            \ 4. Unhandled Exceptions on Malformed / Wrong-Type Input (Line 5)\n\n\
            **Problem:** If `payload` is not valid pickle bytes, `pickle.loads` raises\
            \ `pickle.UnpicklingError`, `EOFError`, or `ValueError`. If `payload`\
            \ is `None` or a `str`, it raises `TypeError`. None of these are caught,\
            \ so a single bad request can produce an unhandled 500 (or worse, depending\
            \ on the framework). There is also no guard that `payload` is actually\
            \ `bytes`.\n\n**Fix:** Add input-type validation and a narrow `try/except`\
            \ around the deserialization:\n\n```python\nif not isinstance(payload,\
            \ (bytes, bytearray, memoryview)):\n    raise TypeError(\"payload must\
            \ be bytes\")\ntry:\n    obj = pickle.loads(payload)\nexcept (pickle.UnpicklingError,\
            \ EOFError, ValueError) as e:\n    raise ValueError(f\"Malformed payload:\
            \ {e}\")\n```\n\n---\n\n### 5. Unbounded Cache Growth (Line 2)\n\n**Problem:**\
            \ `CACHE` is a plain dict with no eviction policy. Every distinct `user_id`\
            \ observed in any request adds an entry that persists for the lifetime\
            \ of the process. In a long-running server handling many users, this is\
            \ an unbounded memory leak that will eventually cause OOM, killing the\
            \ process and losing all in-flight state.\n\n**Fix:** Use a bounded cache\
            \ such as `functools.lru_cache` (if the function can be made cacheable)\
            \ or a third-party `LRUCache` / `cachetools.TTLCache` with a max size.\
            \ Alternatively, add a background task that evicts entries older than\
