turns:
- filename: t1
  request:
    body:
      input: 'Use three subagents: one to find Paris weather using a discovered function
        tool, one to get the Paris time zone using a discovered function tool, and
        one to call the custom tool agentic_raw_echo with CUSTOM_CASSETTE_OK and report
        its output on one line.'
      max_output_tokens: 16384
      model: Qwen/Qwen3.6-35B-A3B-FP8
      multi_agent:
        enabled: true
        max_concurrent_subagents: 3
      store: true
      stream: true
      tools:
      - description: Search the client tool catalog for tools that can satisfy the
          request.
        execution: client
        parameters:
          additionalProperties: false
          properties:
            query:
              description: A concise description of the needed capabilities.
              type: string
          required:
          - query
          type: object
        type: tool_search
      - defer_loading: true
        description: Get the current weather for a city
        name: get_weather
        parameters:
          additionalProperties: false
          properties:
            city:
              type: string
          required:
          - city
          type: object
        strict: true
        type: function
      - defer_loading: true
        description: Get the exchange rate between two currencies
        name: get_exchange_rate
        parameters:
          additionalProperties: false
          properties:
            base:
              type: string
            quote:
              type: string
          required:
          - base
          - quote
          type: object
        strict: true
        type: function
      - defer_loading: true
        description: Search for hotels in a city
        name: search_hotels
        parameters:
          additionalProperties: false
          properties:
            city:
              type: string
          required:
          - city
          type: object
        strict: true
        type: function
      - description: Travel location tools
        name: travel
        tools:
        - defer_loading: true
          description: Get the IANA time zone for a city
          name: get_timezone
          parameters:
            additionalProperties: false
            properties:
              city:
                type: string
            required:
            - city
            type: object
          strict: true
          type: function
        - defer_loading: true
          description: Get latitude and longitude for a city
          name: get_coordinates
          parameters:
            additionalProperties: false
            properties:
              city:
                type: string
            required:
            - city
            type: object
          strict: true
          type: function
        - defer_loading: true
          description: Calculate the distance between two cities
          name: calculate_distance
          parameters:
            additionalProperties: false
            properties:
              destination:
                type: string
              origin:
                type: string
            required:
            - origin
            - destination
            type: object
          strict: true
          type: function
        type: namespace
      - description: Emit the requested cassette token as raw text. The input must
          be exactly CUSTOM_CASSETTE_OK.
        name: agentic_raw_echo
        type: custom
    headers:
      accept: '*/*'
      content-type: application/json
      openai-beta: responses_multi_agent=v1
      user-agent: python-httpx/0.28.1
