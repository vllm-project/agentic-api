          text: "## Agent 1 — Array / Hashing Problems\n\nThese two problems are widely\
            \ practiced interview questions: both appear in a LeetCode community “Top\
            \ 50” interview-preparation list, while the official problem pages provide\
            \ their exact specifications and examples. ([leetcode.com](https://leetcode.com/discuss/post/7503511/?utm_source=openai))\n\
            \n### 1. Two Sum — LeetCode #1\n\n**Problem.** Given an integer array\
            \ `nums` and integer `target`, return the indices of two distinct elements\
            \ whose values sum to `target`. Exactly one valid solution is guaranteed.\
            \ ([leetcode.com](https://leetcode.com/problems/two-sum/description/?show=1&utm_source=openai))\n\
            \n**Algorithm.** Scan left to right while storing each previously seen\
            \ value and its index in a hash map. For each value, check whether `target\
            \ - value` is already present.\n\n```python\nfrom typing import List\n\
            \ndef two_sum(nums: List[int], target: int) -> List[int]:\n    seen =\
            \ {}\n\n    for i, value in enumerate(nums):\n        complement = target\
            \ - value\n\n        if complement in seen:\n            return [seen[complement],\
            \ i]\n\n        seen[value] = i\n\n    raise ValueError(\"No solution\"\
            )\n```\n\n**Complexity:** `O(n)` time and `O(n)` auxiliary space.\n\n\
            **Executed test code**\n\n```python\ntwo_sum_cases = [\n    ([2, 7, 11,\
            \ 15], 9),\n    ([3, 2, 4], 6),\n    ([3, 3], 6),\n]\n\nfor nums, target\
            \ in two_sum_cases:\n    print(f\"two_sum({nums}, {target}) -> {two_sum(nums,\
            \ target)}\")\n```\n\n**Actual output**\n\n```text\ntwo_sum([2, 7, 11,\
            \ 15], 9) -> [0, 1]\ntwo_sum([3, 2, 4], 6) -> [1, 2]\ntwo_sum([3, 3],\
            \ 6) -> [0, 1]\n```\n\n---\n\n### 2. Best Time to Buy and Sell Stock —\
            \ LeetCode #121\n\n**Problem.** Given daily stock prices, choose one day\
            \ to buy and a later day to sell. Return the greatest achievable profit,\
            \ or `0` if no profitable transaction exists. ([leetcode.com](https://leetcode.com/problems/best-time-to-buy-and-sell-stock/description/?envId=9x5spweh&envType=list&utm_source=openai))\n\
            \n**Algorithm.** During one left-to-right pass, retain the lowest price\
            \ encountered so far. At each day, compute the profit that would result\
            \ from selling at the current price and update the best profit.\n\n```python\n\
            from typing import List\n\ndef max_profit(prices: List[int]) -> int:\n\
            \    minimum_so_far = float(\"inf\")\n    best = 0\n\n    for price in\
            \ prices:\n        minimum_so_far = min(minimum_so_far, price)\n     \
            \   best = max(best, price - minimum_so_far)\n\n    return best\n```\n\
            \n**Complexity:** `O(n)` time and `O(1)` auxiliary space.\n\n**Executed\
            \ test code**\n\n```python\nstock_cases = [\n    [7, 1, 5, 3, 6, 4],\n\
            \    [7, 6, 4, 3, 1],\n    [2, 4, 1],\n]\n\nfor prices in stock_cases:\n\
            \    print(f\"max_profit({prices}) -> {max_profit(prices)}\")\n```\n\n\
            **Actual output**\n\n```text\nmax_profit([7, 1, 5, 3, 6, 4]) -> 5\nmax_profit([7,\
            \ 6, 4, 3, 1]) -> 0\nmax_profit([2, 4, 1]) -> 2\n```\n\n### Concise Summary\n\
            \n| Problem | Core technique | Time | Extra space | Verified outputs |\n\
            |---|---|---:|---:|---|\n| Two Sum | One-pass complement hash map | `O(n)`\
            \ | `O(n)` | `[0, 1]`, `[1, 2]`, `[0, 1]` |\n| Best Time to Buy and Sell\
            \ Stock | Running minimum and best profit | `O(n)` | `O(1)` | `5`, `0`,\
            \ `2` |\n\n**Sources:** Official LeetCode problem statements for Two Sum\
            \ and Best Time to Buy and Sell Stock, plus LeetCode’s community-curated\
            \ Top 50 interview list. ([leetcode.com](https://leetcode.com/problems/two-sum/description/?show=1&utm_source=openai))"
