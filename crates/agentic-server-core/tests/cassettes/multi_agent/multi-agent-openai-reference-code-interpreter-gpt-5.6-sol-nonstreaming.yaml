          \ -> List[int]:\n    seen = {}\n    for i, value in enumerate(nums):\n \
          \       complement = target - value\n        if complement in seen:\n  \
          \          return [seen[complement], i]\n        seen[value] = i\n    raise\
          \ ValueError(\"No solution\")\n\ntwo_sum_cases = [\n    ([2, 7, 11, 15],\
          \ 9),\n    ([3, 2, 4], 6),\n    ([3, 3], 6),\n]\nfor nums, target in two_sum_cases:\n\
          \    print(f\"two_sum({nums}, {target}) -> {two_sum(nums, target)}\")\n\n\
          \ndef max_profit(prices: List[int]) -> int:\n    minimum_so_far = float(\"\
          inf\")\n    best = 0\n    for price in prices:\n        minimum_so_far =\
          \ min(minimum_so_far, price)\n        best = max(best, price - minimum_so_far)\n\
          \    return best\n\nstock_cases = [\n    [7, 1, 5, 3, 6, 4],\n    [7, 6,\
          \ 4, 3, 1],\n    [2, 4, 1],\n]\nfor prices in stock_cases:\n    print(f\"\
          max_profit({prices}) -> {max_profit(prices)}\")\n"
