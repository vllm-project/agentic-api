          two_sum(nums: list[int], target: int) -> list[int]:\n    seen = {}\n    for i, value in enumerate(nums):\n        complement
          = target - value\n        if complement in seen:\n            return [seen[complement], i]\n        seen[value] = i\n    raise
          ValueError(\"No solution\")\n\n\ndef is_valid_parentheses(s: str) -> bool:\n    matching_open = {\")\": \"(\", \"]\":
          \"[\", \"}\": \"{\"}\n    stack = []\n\n    for char in s:\n        if char in matching_open:\n            if not stack
          or stack.pop() != matching_open[char]:\n                return False\n        else:\n            stack.append(char)\n\n    return
          not stack\n\n\ntwo_sum_tests = [\n    ([2, 7, 11, 15], 9),\n    ([3, 2, 4], 6),\n    ([3, 3], 6),\n]\nfor nums, target
          in two_sum_tests:\n    print(f\"two_sum({nums}, {target}) -> {two_sum(nums, target)}\")\n\nparentheses_tests = [\"()[]{}\",
