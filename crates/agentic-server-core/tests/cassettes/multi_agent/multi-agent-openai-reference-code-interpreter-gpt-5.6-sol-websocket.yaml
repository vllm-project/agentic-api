          typing import List\n\nclass StockSolution:\n    def maxProfit(self, prices: List[int]) -> int:\n        min_price = float(\"inf\")\n        best_profit
          = 0\n\n        for price in prices:\n            min_price = min(min_price, price)\n            best_profit = max(best_profit,
          price - min_price)\n\n        return best_profit\n\n\nclass MaximumSubarraySolution:\n    def maxSubArray(self, nums:
          List[int]) -> int:\n        current_sum = best_sum = nums[0]\n\n        for num in nums[1:]:\n            current_sum
          = max(num, current_sum + num)\n            best_sum = max(best_sum, current_sum)\n\n        return best_sum\n\n\nstock_inputs
          = [\n    [7, 1, 5, 3, 6, 4],\n    [7, 6, 4, 3, 1],\n]\nsubarray_inputs = [\n    [-2, 1, -3, 4, -1, 2, 1, -5, 4],\n    [-5,
          -2, -8],\n]\n\nstock_solver = StockSolution()\nsubarray_solver = MaximumSubarraySolution()\n\nfor prices in stock_inputs:\n    print(f\"maxProfit({prices})
