          request.
        execution: client
        parameters:
          additionalProperties: false
          properties:
            query:
              description: A concise description of the needed capabilities.
              type: string
          required:
          - query
          type: object
        type: tool_search
      - defer_loading: true
        description: Get the current weather for a city
        name: get_weather
        parameters:
          additionalProperties: false
          properties:
            city:
              type: string
          required:
          - city
          type: object
        strict: true
        type: function
