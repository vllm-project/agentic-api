            # Test Coverage Gaps for `load_profile()` in cache.py


            ## Existing Test (Baseline)

            - Loads one valid payload for one user, asserts the returned profile.

            - This tests the happy path only.


            ---


            ## Prioritized Missing Tests


            ### 🔴 P0 — Critical (Data Corruption / Security)


            | # | Category | Test Name | What It Verifies |

            |---|----------|-----------|------------------|

            | 1 | **Mutability** | `test_mutation_affects_cache` | Mutate the dict
            returned by `load_profile()`, then call `load_profile()` again for the
            same user. The second call must return a dict with the mutated values.
            This confirms the returned reference is the cached object itself — a bug
            to document/fix. |

            | 2 | **Pickle deserialization (unauthenticated)** | `test_payload_from_untrusted_source`
            | Pass a crafted pickle payload that creates an arbitrary object (or executes
            code via `__reduce__`). This tests the critical security issue of calling
            `pickle.loads()` on unauthenticated input. |

            | 3 | **Cache poisoning** | `test_cache_poisoning_via_injection` | Inject
            a payload that returns a dict with unexpected keys, then call `load_profile()`
            for another user. Verify the cache is not cross-contaminated, but also
            document that the injected object is permanently cached. |


            ---


            ### 🟠 P1 — High (Correctness & Edge Cases)


            | # | Category | Test Name | What It Verifies |

            |---|----------|-----------|------------------|

            | 4 | **Cache identity** | `test_cache_returns_same_object` | Call `load_profile(user_id,
            payload)` twice with the same valid payload. Assert `result1 is result2`
            (identity check, not equality). |

            | 5 | **Exception: empty bytes** | `test_empty_payload_raises` | Pass
            `b""` as payload. Verify that `pickle.loads()` raises `EOFError` or `pickle.UnpicklingError`.
            The function should propagate the exception. |

            | 6 | **Exception: invalid pickle data** | `test_garbage_payload_raises`
            | Pass random bytes (e.g., `b"this is not pickle data"`) as payload. Verify
            a `pickle.UnpicklingError` is raised. |

            | 7 | **Exception: truncated pickle** | `test_truncated_payload_raises`
            | Pass the first few bytes of a valid pickle. Verify `EOFError` or `pickle.UnpicklingError`
            is raised. |

            | 8 | **Cache growth** | `test_multiple_users_fill_cache` | Load 10+ distinct
            `user_id` values with distinct payloads. Assert `len(CACHE) == 10` and
            each key has the correct profile. |

            | 9 | **Payload: None** | `test_none_payload_raises` | Pass `None` as
            payload. Verify `pickle.loads(None)` raises `TypeError`. The function
            should propagate it. |

            | 10 | **Payload: non-bytes type** | `test_string_payload_raises` | Pass
            a `str` instead of `bytes` as payload. Verify `pickle.loads()` raises
            `TypeError`. |

            | 11 | **user_id: None** | `test_none_user_id_raises` | Pass `None` as
            `user_id`. Verify a `TypeError` (unhashable type) or that the cache stores
            `None` as a key. |

            | 12 | **user_id: already exists** | `test_existing_user_id_returns_cached`
            | Load a user, then load again with a *different* payload for the same
            user_id. The second call should return the *cached* profile (from the
            first call), not the new payload. Confirms the early-return cache behavior.
            |


            ---


            ### 🟡 P2 — Medium (Concurrency & Operational)


            | # | Category | Test Name | What It Verifies |

            |---|----------|-----------|------------------|

            | 13 | **Concurrent access** | `test_concurrent_loads_same_user` | Spawn
            multiple threads simultaneously calling `load_profile(user_id, payload)`
            for the same user. Assert all threads receive the same object and no `KeyError`/race
            corruption occurs. Documents the thread-safety gap. |

            | 14 | **Concurrent distinct users** | `test_concurrent_loads_distinct_users`
            | Spawn N threads, each calling with a unique `user_id`. Assert the cache
            grows to size N and no race-condition exceptions. |

            | 15 | **TTL / no eviction** | `test_no_eviction_cache_grows_unbounded`
            | Load 1000+ distinct users, then assert `len(CACHE) == 1000`. Verify
            the cache never evicts entries, documenting the unbounded growth risk.
            |

            | 16 | **user_id: numbers** | `test_numeric_user_id` | Use an integer
            (e.g., `42`) as `user_id`. Verify it works as a valid dict key. |

            | 17 | **user_id: special characters** | `test_special_char_user_id` |
            Use strings with Unicode, spaces, or special chars (e.g., `"user@test.com"`,
            `"αβγ"`) as `user_id`. Verify no KeyError and the correct cache entry
            is returned. |


            ---


            ### 🟢 P3 — Low (Defensive / Documentation)


            | # | Category | Test Name | What It Verifies |

            |---|----------|-----------|------------------|

            | 18 | **Return type** | `test_returns_dict` | Assert the returned object
            is a `dict` (or whatever the pickle payload produces). |

            | 19 | **cache.clear()** | `test_cache_clear_works` | Call `cache.CACHE.clear()`,
            then call `load_profile()` again. Verify the function re-loads from the
            payload (not a stale reference). |

            | 20 | **user_id: empty string** | `test_empty_string_user_id` | Pass
            `""` as `user_id`. Verify it is stored as a valid key. |


            ---


            ## Summary


            | Priority | Count | Focus |

            |----------|-------|-------|

            | **P0** | 3 | Mutability, pickle RCE, cache poisoning |

            | **P1** | 9 | Identity, exceptions, cache growth, edge cases |

            | **P2** | 4 | Concurrency, unbounded growth, valid key types |

            | **P3** | 3 | Return type, cache management, edge keys |


            **Total missing tests: 19**


            The most critical gaps are the **mutability bug** (P0 #1) which corrupts
            cached data, and the **unauthenticated `pickle.loads()`** (P0 #2) which
            is an arbitrary code execution vulnerability. These should be fixed before
            additional tests are written.'
