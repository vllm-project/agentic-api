            \ with different payloads. Verify the cached value from the FIRST call\
            \ is returned (cache should not overwrite on subsequent calls for the\
            \ same key). |\n| C3 | **Multiple users with distinct payloads** | Load\
            \ profiles for 2+ different user_ids with different payloads and verify\
            \ each returns the correct, distinct cached data. |\n| C4 | **Concurrent\
            \ access (thread safety)** | Spawn multiple threads calling `load_profile()`\
            \ concurrently for the same and different user_ids. Verify no race conditions,\
            \ no corrupted state, and no crashes. Currently the global `CACHE` dict\
            \ is accessed without locks. |\n| C5 | **Cache eviction / memory pressure**\
            \ | Load a large number of distinct user_ids and verify behavior (currently\
            \ there is NO eviction – the cache grows unboundedly). This should be\
            \ tested to demonstrate the memory leak. |\n| C6 | **Return type consistency**\
            \ | Verify that `load_profile()` always returns the same Python type as\
            \ produced by `pickle.loads()` (dict, list, etc.). |\n\n**Priority: HIGH**\
            \ – These will cause data corruption and unpredictable behavior in production.\n\
            \n---\n\n## 3. MEDIUM PRIORITY – Edge Cases\n\nThese are important for\
            \ robustness but may not cause immediate failures.\n\n| # | Test Case\
            \ | Description |\n|---|-----------|-------------|\n| E1 | **Empty user_id\
            \ string** | Call `load_profile(\"\", payload)` and verify behavior (empty\
            \ string is a valid dict key). |\n| E2 | **None as user_id** | Call `load_profile(None,\
            \ payload)` and verify behavior. |\n| E3 | **None as payload** | Call\
            \ `load_profile(\"user\", None)` and verify it raises an appropriate exception.\
            \ |\n| E4 | **Empty bytes as payload** | Call `load_profile(\"user\",\
            \ b\"\")` and verify it raises `pickle.UnpicklingError`. |\n| E5 | **Very\
            \ large user_id string** | Call with a user_id of 1MB+ and verify behavior\
            \ (potential DoS via memory). |\n| E6 | **User_id with special characters**\
            \ | Call with user_id containing spaces, unicode, or other special characters\
            \ and verify expected behavior. |\n| E7 | **Payload that produces empty\
            \ dict** | Send a pickle that produces `{}` and verify caching works normally.\
            \ |\n| E8 | **Payload that produces nested dict** | Send a pickle that\
            \ produces `{\"outer\": {\"inner\": \"value\"}}` and verify nested access\
            \ works. |\n| E9 | **Repeated calls for same user (cache hit path)** |\
            \ Call `load_profile(\"alice\", payload)` twice and verify the second\
            \ call uses the cache (not re-pickling). Can verify via timing or mock.\
            \ |\n\n**Priority: MEDIUM** – These ensure the code handles unexpected\
            \ inputs gracefully.\n\n---\n\n## 4. LOW PRIORITY – Design/Architectural\
            \ Tests\n\nThese highlight systemic issues but don't test specific code\
            \ paths.\n\n| # | Test Case | Description |\n|---|-----------|-------------|\n\
            | D1 | **Global state persistence across test runs** | Verify whether\
