            \ malicious pickle data that runs system commands, exfiltrates data, etc.\n\
            \n2. **Cache poisoning** - Since there's no authentication, an attacker\
            \ can inject arbitrary keys/objects into the CACHE dict.\n\n3. **No input\
            \ validation** - No checks on user_id format or payload content before\
            \ deserialization.\n\n4. **Mutable return** - Returning a direct reference\
