            All three agents have completed. Let me now synthesize their findings
            into one prioritized review.


            ---


            # Prioritized Review: cache.py


            ## Code Under Review

            ```python

            1: import pickle

            2: CACHE = {}

            3: def load_profile(user_id, payload):

            4:     if user_id not in CACHE:

            5:         CACHE[user_id] = pickle.loads(payload)

            6:     return CACHE[user_id]

            ```


            ---


            ## P0 — CRITICAL (Immediate Exploit)


            ### 1. Remote Code Execution via `pickle.loads()` — Line 5

            **Correctness & Security Findings Converge.** `pickle.loads()` on line
            5 deserializes attacker-controlled bytes from the HTTP request. A crafted
            `__reduce__` method in the pickle stream can invoke arbitrary Python functions,
            resulting in full server compromise from a single unauthenticated HTTP
            request.


            ### 2. Unauthenticated Access — Lines 3, 5

            The function accepts `payload` bytes from an unauthenticated HTTP request
            with zero access control. Combined with #1, this makes the RCE vector
            directly exploitable by any remote attacker.


            **Mitigation:** Replace `pickle` with a safe serialization format (JSON,
            MessagePack). Add authentication/authorization before processing any request.


            ---


            ## P1 — HIGH (Data Integrity, Availability, Cache Poisoning)


            ### 3. Cache Poisoning / `user_id` Injection — Lines 4, 5, 6

            An attacker can supply any arbitrary `user_id` and a malicious payload.
            If the key is absent, the attacker''s poisoned data is stored and returned
            to any subsequent legitimate caller using that `user_id`. This corrupts
            data integrity for potentially other users.


            ### 4. Denial of Service — Lines 2, 5

            - **Memory exhaustion (Line 2):** `CACHE = {}` has no eviction policy,
            TTL, or max-size limit. Every distinct `user_id` grows the dictionary
            unboundedly, eventually causing OOM.

            - **CPU exhaustion (Line 5):** Crafted pickle payloads can trigger excessive
            deserialization work (deeply nested structures, millions of items) without
            any resource limits.


            ### 5. Direct Return of Mutable Reference — Line 6

            `return CACHE[user_id]` returns the exact dict object stored in the cache.
            Any caller can mutate it, corrupting the cached data for all subsequent
            callers. No `copy.deepcopy()` or defensive copy is performed.


            **Mitigation:** Use `copy.deepcopy(CACHE[user_id])` or return immutable
            views (`types.MappingProxyType`). Add a max-size cache with eviction (e.g.,
            `cachetools.LRUCache`) and a TTL.


            ---


            ## P2 — MEDIUM (Concurrency, Observability)


            ### 6. Check-Then-Act Race Condition — Lines 4, 5

            The check (`if user_id not in CACHE`) on line 4 and the assignment on
            line 5 are not atomic. Two threads loading the same `user_id` simultaneously
            both pass the check and both call `pickle.loads()`, causing redundant
            deserialization and non-deterministic overwrite (last-write-wins).


            ### 7. No Synchronization Primitives — Lines 2, 4, 5

            The global mutable `dict` on line 2 is accessed by multiple threads without
            `threading.Lock` or any synchronization. The CPython GIL ensures individual
            dict ops are atomic but does NOT protect the compound check-then-act pattern.


            ### 8. No TTL / Stale Data — Lines 4, 5

            Once a profile is cached it stays forever. Updates to the profile in the
            backing store are never reflected. There are no hit/miss metrics or observability
            hooks.


            **Mitigation:** Wrap lines 4–5 in a `threading.Lock`. Consider `cachetools.TTLCache`
            for automatic expiration. Add cache metrics.


            ---


            ## P3 — LOW / DOCUMENTATION


            ### 9. No Input Validation — Line 3

            No handling for `None` payloads, empty bytes, or malformed `user_id` types.
            Invalid input will raise unhandled `pickle.UnpicklingError` or `TypeError`,
            returning 500 to the caller.


            ---


            # Missing Tests — Concrete Proposals


            The only existing test ("loads one valid payload for one user") covers
            virtually nothing. Below are the critical test gaps, organized by priority:


            ## CRITICAL Priority Tests


            | # | Test Name | What It Verifies | Expected Behavior |

