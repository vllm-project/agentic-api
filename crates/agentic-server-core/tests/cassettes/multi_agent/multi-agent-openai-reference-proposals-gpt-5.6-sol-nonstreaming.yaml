            higher stated risk |

            | **Beta** | 8 weeks | Low | Takes 2 weeks longer, but has lower stated
            risk |


            ## Recommendation


            **Recommend proposal Beta**, provided the additional two weeks are acceptable.
            With no stated deadline or other decision criteria, its lower risk is
            the stronger default tradeoff.


            Choose **Alpha** instead if delivery within six weeks is a firm priority
            and stakeholders are willing to accept medium risk.


            ## Assumptions and missing information


            This recommendation assumes the risk ratings were produced using the same
            methodology and that both proposals cover comparable scope and quality.
            The returned data does not specify:


