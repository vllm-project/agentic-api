          text: "## Correctness findings\n\n1. **High — Cache key ignores `payload`,\
            \ so the first payload permanently wins** (`cache.py:4-6`)  \n   Once\
            \ a `user_id` is present, every later call returns the original profile\
            \ without examining the new payload. This creates stale data and order-dependent\
            \ behavior; a request that populates the key first determines all future\
            \ results for that process. Because there is no invalidation or expiration\
            \ (`cache.py:2,4-5`), the inconsistency is permanent until restart.  \n\
            \   **Remediation:** Define explicit cache semantics. If profiles can\
            \ change, invalidate/update entries or include a payload/version digest\
            \ in the key and apply a bounded TTL. If first-write semantics are intended,\
            \ reject conflicting payloads rather than silently ignoring them.\n\n\
            2. **High — Returning the cached mutable object exposes and corrupts shared\
            \ cache state** (`cache.py:6`)  \n   Callers receive the exact dictionary\
            \ stored in `CACHE`; any mutation changes subsequent callers’ results.\
            \ Concurrent callers can observe partial multi-step updates, lose updates,\
            \ or fail while iterating if another caller mutates the dictionary.  \n\
            \   **Remediation:** Store/return immutable profile objects, or return\
            \ a defensive deep copy. Prefer keeping mutation behind synchronized cache\
            \ APIs rather than exposing internal objects.\n\n3. **High — Check-then-populate\
            \ is racy and can choose a nondeterministic payload** (`cache.py:4-6`)\
            \  \n   Two threads calling the same uncached `user_id` can both pass\
            \ line 4 and deserialize different payloads. Both may assign; the last\
            \ assignment wins, duplicate work occurs, and returned values can depend\
            \ on interleaving (a thread may even return the value installed by the\
            \ other thread at line 6). Individual dictionary operations being atomic\
            \ does not make the whole sequence atomic.  \n   **Remediation:** Synchronize\
            \ population with a lock or per-key single-flight mechanism covering the\
            \ existence check, creation, and installation. Establish deterministic\
            \ behavior for competing payloads. Also prevent unsynchronized mutation\
            \ of stored values.\n\n4. **Medium — Global, unbounded, process-local\
            \ cache causes memory growth and cross-worker inconsistency** (`cache.py:2,5`)\
            \  \n   Every distinct user ID remains forever. Long-running processes\
            \ can grow without bound, while separate server workers maintain different\
            \ “first” values for the same user. Restarts also silently reset behavior.\
            \  \n   **Remediation:** Use a bounded cache with TTL/eviction, or a shared\
            \ cache if cross-worker consistency is required; document restart and\
            \ consistency semantics.\n\n5. **Medium — Deserialized value is not validated\
            \ as a profile dictionary** (`cache.py:5-6`)  \n   `pickle.loads` may\
            \ return any Python object, so callers cannot safely rely on the stated\
            \ dictionary contract. Invalid-but-deserializable payloads can poison\
            \ a key indefinitely.  \n   **Remediation:** Validate the decoded type\
            \ and required schema before insertion; only publish a fully validated\
            \ value atomically. Replace pickle at the HTTP boundary as covered by\
            \ the security review."
