          text: "## Missing tests and proposed cases\n\nThe lone happy-path test does\
            \ not cover the most consequential behavior.\n\n### P0 — Unsafe HTTP deserialization\n\
            \n1. **Unauthenticated requests are rejected before parsing**\n   - **Refs:**\
            \ HTTP handler calling `cache.load_profile`; `cache.py:3-5`\n   - Send\
            \ a profile request without credentials and assert `401`/`403`.\n   -\
            \ Monkeypatch `cache.pickle.loads` to fail if called; assert it was **not\
            \ invoked**. This verifies authentication occurs before deserialization.\n\
            \n2. **Arbitrary pickle payloads are never deserialized**\n   - **Refs:**\
            \ `cache.py:1,5`\n   - After replacing pickle with a safe format, submit\
            \ a pickle-formatted payload and assert a client error without executing\
            \ it.\n   - Prefer monkeypatching `pickle.loads` or using a harmless sentinel\
            \ rather than a gadget that launches a process.\n   - This should fail\
            \ against the current implementation and serve as a security regression\
            \ test.\n\n3. **Malformed and schema-invalid bodies are rejected**\n \
            \  - **Refs:** HTTP boundary; `cache.py:5-6`\n   - Cases: random bytes,\
            \ truncated serialization, valid scalar/list instead of a dictionary,\
            \ missing required profile fields, wrong field types, excessive nesting.\n\
            \   - Assert stable `400`/`422`, no cache entry, and no internal exception\
            \ details in the response.\n\n4. **Payload-size and request limits**\n\
            \   - **Refs:** HTTP boundary; unbounded `pickle.loads` at `cache.py:5`\n\
            \   - Submit a body over the configured maximum and expect `413` before\
            \ parsing.\n   - Verify compressed/declared-length edge cases cannot bypass\
