turns:
- filename: t1
  request:
    body:
      input: 'Complete three independent jobs, assigning a different subagent to each
        so they can work in parallel: (1) use web search to find Python''s official
        documentation for the csv module and summarize how it reads CSV rows, citing
        the source; (2) use the gitmcp_tiktoken MCP server''s search_tiktoken_documentation
        tool to find how tiktoken encodes text into tokens and decodes tokens back
        into text, and summarize the returned documentation; (3) use the local shell
        tool with this exact command: python3 -c ''print(sum(range(1, 11)))''. The
        shell environment is Linux bash with Python 3. Wait for the client to return
        shell_call_output before reporting the calculation''s result. Collect the
        three agents'' findings and provide one combined answer with a section for
        each job. Use the requested tools rather than answering from memory or inventing
        tool outputs. If a tool fails, report the observed failure.'
      max_output_tokens: 16384
      model: gpt-5.6-sol
      multi_agent:
        enabled: true
        max_concurrent_subagents: 3
      store: true
      stream: true
      tools:
      - type: web_search
      - allowed_tools:
        - search_tiktoken_documentation
        require_approval: never
        server_label: gitmcp_tiktoken
        server_url: https://gitmcp.io/openai/tiktoken
        type: mcp
      - environment:
          type: local
        type: shell
    headers:
      accept: '*/*'
      authorization: Bearer ***
      content-type: application/json
      openai-beta: responses_multi_agent=v1
      user-agent: python-httpx/0.28.1
