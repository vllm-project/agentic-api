      Use `tiktoken.get_encoding(\"o200k_base\")` for a named encoding or `tiktoken.encoding_for_model(\"gpt-4o\")`
      for a model’s mapped tokenizer.\n- `enc.encode(text)` converts text to token
      IDs; `enc.decode(token_ids)` reconstructs the full text.\n- For one token, use
      `enc.decode_single_token_bytes(token_id)`. Individual tokens may split a UTF-8
      character, so decoding them separately as strings can be lossy; decode the complete
      sequence when possible.\n- `encode` supports `allowed_special` and `disallowed_special`.
      Special-token-like text is rejected by default unless explicitly permitted or
      configured to be treated as ordinary text.\n- The repository README demonstrates
      a lossless full-sequence round trip: `enc.decode(enc.encode(\"hello world\"))
