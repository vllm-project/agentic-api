        - annotations: []
          logprobs: []
          text: 'Official `openai/tiktoken` documentation shows:


            ```python

            import tiktoken


            enc = tiktoken.get_encoding("o200k_base")

            tokens = enc.encode("hello world")

            text = enc.decode(tokens)


            assert text == "hello world"

            ```


            For a model-specific tokenizer:


            ```python

            enc = tiktoken.encoding_for_model("gpt-4o")

            ```


            Key points:


            - `encode()` converts text to numeric token IDs.

            - `decode()` converts a token sequence back to text.

            - Tiktoken uses reversible, lossless byte-pair encoding (BPE).

            - Install with `pip install tiktoken`.

            - The repository identifies `tiktoken/core.py` as the tokenizer API reference.


            The GitMCP index did not expose detailed documentation for `decode_single_token_bytes`
            or its UTF-8 caveats, so those details were not verified from the retrieved
            documentation.'
