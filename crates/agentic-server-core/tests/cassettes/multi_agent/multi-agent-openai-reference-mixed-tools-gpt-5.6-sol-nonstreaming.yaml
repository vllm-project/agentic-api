          text: '### Job 1 — Python `csv` row reading


            Python’s official documentation recommends opening CSV files with `newline=''''`,
            passing the file to `csv.reader()`, and iterating over the reader. Each
            parsed row is returned as a **list of strings**; no automatic type conversion
            occurs unless `QUOTE_NONNUMERIC` is enabled, which converts unquoted fields
            to floats. Dialect and formatting arguments control delimiters, quoting,
            and related parsing rules. `csv.DictReader` returns rows as dictionaries
            and, by default, uses the first row as field names. ([docs.python.org](https://docs.python.org/3/library/csv.html))'
