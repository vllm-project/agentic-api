        - annotations: []
          text: "\n\nHere is my summary of how Python's csv module reads CSV rows,\
            \ based on the official documentation:\n\n---\n\n## Python csv Module\
            \ — Summary of Row Reading\n\n**Source:** [csv — CSV File Reading and\
            \ Writing — Python 3.14.7 documentation](https://docs.python.org/3/library/csv.html)\
            \ (official Python documentation)\n\n### `csv.reader(csvfile, dialect='excel',\
            \ **fmtparams)`\n\n- Takes a **file object** (opened with `newline=''`)\
            \ and returns a **reader object**, which is an **iterator**.\n- You iterate\
            \ over it (e.g., with a `for` loop) and **each row is returned as a list\
            \ of strings**.\n- Example:\n  ```python\n  import csv\n  with open('data.csv',\
            \ newline='') as f:\n      reader = csv.reader(f)\n      for row in reader:\n\
            \          print(row)  # ['1', '2', '3']  — a list of strings\n  ```\n\
            - The reader does not distinguish header rows — every row is treated the\
            \ same.\n- Optional `dialect` and keyword formatting parameters let you\
            \ customize delimiter, quoting, etc.\n\n### `csv.DictReader(csvfile, fieldnames=None,\
            \ restkey=None, restval=None, dialect='excel', *args, **kwds)`\n\n- Like\
            \ `csv.reader`, but **returns each row as a dictionary** instead of a\
            \ list.\n- By default, the **first row of the file is used as the dictionary\
            \ keys** (fieldnames). You can also supply a `fieldnames` list explicitly.\n\
            - Since Python 3.8, returned rows are of type `dict` (prior to 3.6 it\
            \ was `OrderedDict`).\n- Example:\n  ```python\n  import csv\n  with open('names.csv',\
            \ newline='') as csvfile:\n      reader = csv.DictReader(csvfile)\n  \
            \    for row in reader:\n          print(row['first_name'], row['last_name'])\
            \  # dict access by column name\n  ```\n\n### Key Takeaways\n\n| Feature\
            \ | `csv.reader` | `csv.DictReader` |\n|---|---|---|\n| Row type | `list`\
            \ of strings | `dict` (keys = field names) |\n| Header handling | None\
            \ — treats all rows equally | First row used as keys (or supplied via\
            \ `fieldnames`) |\n| Iteration | `for row in reader` | `for row in reader`\
            \ |\n| File opening | Must use `newline=''` | Must use `newline=''` |\n\
            \nBoth return **iterators**, meaning they read row by row from the file\
            \ lazily — you never have to load the entire file into memory."
