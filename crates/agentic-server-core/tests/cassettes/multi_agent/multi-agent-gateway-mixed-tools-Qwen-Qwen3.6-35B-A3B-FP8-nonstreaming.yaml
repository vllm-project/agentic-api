            \ module:\n\n---\n\n## Python `csv` Module — Key Concepts & Classes\n\n\
            ### 1. **`csv.reader`**\n- Reads CSV files and returns each row as a **list\
            \ of strings**.\n- Usage: Open the file with `open(..., newline='')`,\
            \ then pass the file object to `csv.reader()`.\n- Iterates row by row\
            \ — ideal for memory-efficient reading.\n- Default delimiter is a comma\
            \ `,`, but you can specify others via the `delimiter` parameter.\n\n```python\n\
            with open('data.csv', newline='') as f:\n    reader = csv.reader(f)\n\
            \    for row in reader:\n        print(row)  # e.g., ['1', '2', '3']\n\
            ```\n\n### 2. **`csv.writer`**\n- Writes data to CSV files.\n- `writerow()`\
            \ writes a single row; `writerows()` writes multiple rows at once.\n-\
            \ Automatically handles quoting when field values contain delimiters or\
            \ newlines.\n\n```python\nwith open('output.csv', 'w', newline='') as\
            \ f:\n    writer = csv.writer(f)\n    writer.writerow(['a', 'b', 'c'])\n\
            \    writer.writerows([[0, 1, 2], ['x', 'y', 'z']])\n```\n\n### 3. **`csv.DictReader`**\n\
            - Reads CSV files and returns each row as a **dictionary**, using the\
            \ header row as keys.\n- Useful when you want to access columns by name\
            \ rather than index.\n\n```python\nwith open('data.csv', newline='') as\
            \ f:\n    reader = csv.DictReader(f)\n    for row in reader:\n       \
            \ print(row['name'])  # access by column header\n```\n\n### 4. **`csv.DictWriter`**\n\
            - Writes dictionaries to CSV files.\n- Requires a **`fieldnames`** parameter\
            \ specifying which dictionary keys to write and in what order.\n- Call\
            \ `writeheader()` to write the header row before writing data rows.\n\n\
            ```python\nwith open('output.csv', 'w', newline='') as f:\n    fieldnames\
            \ = ['name', 'email']\n    writer = csv.DictWriter(f, fieldnames=fieldnames)\n\
            \    writer.writeheader()\n    writer.writerow({'name': 'John', 'email':\
            \ 'john@example.com'})\n```\n\n### 5. **Dialects & Formatting Parameters**\n\
            - A **Dialect** groups formatting parameters (delimiter, quotechar, quoting\
            \ style, etc.) into a reusable subclass.\n- Common parameters:\n  - `delimiter`\
            \ — character separating fields (default: `,`)\n  - `quotechar` — character\
            \ used to quote fields containing special chars (default: `\"`)\n  - `quoting`\
            \ — one of `QUOTE_MINIMAL`, `QUOTE_ALL`, `QUOTE_NONNUMERIC`, `QUOTE_STRINGS`\n\
            \  - `skipinitialspace` — ignore spaces after delimiter\n  - `lineterminator`\
            \ — line ending string\n\n### 6. **Important Notes**\n- **Always use `newline=''`**\
            \ when opening CSV files in Python 3, as the csv module handles its own\
            \ newline translation.\n- The module can handle any text-file format,\
            \ not just comma-separated values.\n- For large datasets or advanced operations,\
            \ libraries like **pandas** or **NumPy** are recommended, but the standard\
            \ `csv` module is sufficient for many use cases.\n\n---\n\nReference:\
            \ [Official Python Documentation — csv module](https://docs.python.org/3/library/csv.html)"
