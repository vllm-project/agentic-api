        - annotations: []
          text: "\n\nHere's a concise summary of the Python `csv` module documentation:\n\
            \n---\n\n## Python `csv` Module — Summary\n\nThe **`csv` module** (part\
            \ of Python's standard library) provides classes to read and write tabular\
            \ data in CSV (Comma-Separated Values) format. It handles the nuances\
            \ of different CSV dialects so you don't have to.\n\n### Core Classes\n\
            \n| Class | Purpose |\n|---|---|\n| `csv.reader(csvfile, dialect='excel',\
            \ **fmtparams)` | Reads a CSV file and returns an iterable that yields\
            \ each row as a **list of strings**. |\n| `csv.writer(csvfile, dialect='excel',\
            \ **fmtparams)` | Writes data to a CSV file. You call methods on the returned\
            \ writer object to write rows. |\n| `csv.DictReader(csvfile, fieldnames=None,\
            \ restkey=None, restval=None, dialect='excel', **kwds)` | Reads rows as\
            \ **dictionaries**, using the header row as keys. |\n| `csv.DictWriter(csvfile,\
            \ fieldnames, restval='', extrasaction='raise', dialect='excel', **kwds)`\
            \ | Writes rows from dictionaries; requires `fieldnames` to specify column\
            \ order. |\n\n### Key Methods\n\n**Reader** objects (iterable):\n- Iterate\
            \ directly: `for row in reader: print(row)`\n- `next(reader)` — get the\
            \ next row\n\n**Writer** objects:\n- `writer.writerow(row)` — write a\
            \ single row (iterable of strings)\n- `writer.writerows(rows)` — write\
            \ multiple rows at once (list of iterables)\n\n**DictWriter** objects:\n\
            - `writer.writeheader()` — write the header row\n- `writer.writerow(dict)`\
            \ — write one row from a dict\n- `writer.writerows(list_of_dicts)` — write\
            \ multiple rows from dicts\n\n### Common Parameters\n\n| Parameter | Description\
            \ |\n|---|---|\n| `delimiter` | Character separating fields (default `,`)\
            \ |\n| `quotechar` | Character for quoting fields containing special chars\
            \ (default `\"`) |\n| `quoting` | One of `QUOTE_MINIMAL`, `QUOTE_ALL`,\
            \ `QUOTE_NONNUMERIC`, `QUOTE_NONE` |\n| `skipinitialspace` | Ignore whitespace\
            \ after delimiter (default `False`) |\n| `lineterminator` | Line ending\
            \ character (default `'\\r\\n'`) |\n\n### Dialects\n\nA **dialect** is\
            \ a subclass of `Dialect` that bundles formatting parameters (delimiter,\
            \ quotechar, etc.). Built-in dialects include `'excel'`, `'excel-tab'`,\
            \ and `'unix'`. You can also register custom dialects with `csv.register_dialect()`.\n\
            \n### Best Practices\n\n- **Always open CSV files with `newline=''`**\
            \ so the `csv` module handles line endings correctly:\n  ```python\n \
            \ with open('data.csv', newline='', encoding='utf-8') as f:\n      reader\
            \ = csv.reader(f)\n  ```\n- Use `encoding='utf-8'` for text compatibility.\n\
            - Use `DictReader` / `DictWriter` when you need field-name access instead\
            \ of positional indexing.\n- Import constants like `csv.QUOTE_MINIMAL`\
            \ for quoting behavior.\n\n---\n\n*Source: [Python 3.14 docs — csv module](https://docs.python.org/3/library/csv.html)*"
