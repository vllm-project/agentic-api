            gpt-4o\")  # automatically resolves to the right encoding\n```\n\n**C.\
            \ Manually** — full control, useful for extending with custom special\
            \ tokens:\n```python\nenc = tiktoken.Encoding(\n    name=\"cl100k_im\"\
            ,\n    pat_str=...,        # regex pattern string\n    mergeable_ranks=...,\
            \   # dict mapping token bytes to rank/int\n    special_tokens=...,  \
            \  # dict mapping special token strings to IDs\n)\n```\n\n### 2. Encoding\
            \ Text → Tokens\n\nUse the `.encode(text)` method, which returns a list\
            \ of integer token IDs:\n\n```python\nimport tiktoken\nenc = tiktoken.get_encoding(\"\
            o200k_base\")\ntokens = enc.encode(\"hello world\")\n# tokens is a list\
            \ of ints, e.g. [15496, 995]\n```\n\n### 3. Decoding Tokens → Text\n\n\
            Use the `.decode(tokens)` method, which reconstructs the original text.\
            \ The round-trip is **lossless and reversible**:\n\n```python\nimport\
            \ tiktoken\nenc = tiktoken.get_encoding(\"o200k_base\")\nassert enc.decode(enc.encode(\"\
            hello world\")) == \"hello world\"\n```\n\n### Key Properties of BPE Tokenization\n\
            \n- **Reversible & lossless** — you can always convert tokens back to\
            \ the original text.\n- **Works on arbitrary text** — even text not in\
            \ the training data.\n- **Compresses text** — each token is roughly 4\
            \ bytes on average, so the token sequence is shorter than the original\
            \ byte representation.\n- **Common subwords** — BPE splits text into meaningful\
            \ subword units (e.g., \"encoding\" → \"encod\" + \"ing\"), helping models\
            \ generalize across contexts.\n\n### Educational Submodule\n\nFor learning\
            \ purposes, tiktoken includes a `tiktoken._educational` submodule that\
            \ lets you train a simple BPE encoder and visualize the encoding process:\n\
            \n```python\nfrom tiktoken._educational import *\nenc = train_simple_encoding()\n\
