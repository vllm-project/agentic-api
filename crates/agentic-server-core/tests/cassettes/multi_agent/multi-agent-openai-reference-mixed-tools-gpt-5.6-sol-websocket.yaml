          — CSV File Reading and Writing — Python 3.14.7 documentation","url":"https://docs.python.org/3/library/csv.html"}],"logprobs":[],"text":"The
          official Python documentation says the `csv` module reads and writes CSV/tabular data while accommodating different delimiters,
          quoting rules, and dialects.\n\n- `csv.reader()` iterates over rows, normally returning each as a list of strings.\n-
          `csv.writer()` provides `writerow()` and `writerows()`.\n- `DictReader` and `DictWriter` operate on dictionary-shaped
          rows; `DictWriter.writeheader()` writes the field names.\n- Open CSV files with `newline=''''`; specify `encoding` explicitly
          when appropriate.\n- Customize parsing and output with dialects or options such as `delimiter`, `quotechar`, and `quoting`.
          ([docs.python.org](https://docs.python.org/3/library/csv.html))\n\n```python\nimport csv\n\nwith open(\"in.csv\", newline=\"\",
