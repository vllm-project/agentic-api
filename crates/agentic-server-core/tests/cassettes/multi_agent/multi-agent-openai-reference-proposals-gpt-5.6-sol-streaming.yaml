  request:
    body:
      input: 'Complete these independent jobs for a proposal decision: (1) retrieve
        proposal alpha using get_proposal and assess its delivery time and risk; (2)
        retrieve proposal beta using get_proposal and assess its delivery time and
        risk. Use subagents to work on the jobs in parallel. Once their assessments
        are available, compare the tradeoffs and recommend a proposal using the returned
        data. Identify any assumptions or missing information instead of inventing
        proposal details.'
