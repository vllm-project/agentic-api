      model: gpt-5.6-sol
      multi_agent:
        enabled: true
        max_concurrent_subagents: 3
      store: true
      stream: true
      tools:
      - description: Return details for a proposal that the agents should compare.
        name: get_proposal
        parameters:
          additionalProperties: false
          properties:
            proposal:
              enum:
              - alpha
              - beta
              type: string
          required:
          - proposal
          type: object
        strict: true
        type: function
